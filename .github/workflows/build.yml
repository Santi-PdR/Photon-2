name: Forge 1.20.1 build

on:
  push:
    branches:
      - codex/photon-forge-1.20.1
  pull_request:
    branches:
      - codex/photon-forge-1.20.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and run unit tests
        run: ./gradlew build --no-daemon --console=plain

      - name: Upload Forge mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: photon-forge-1.20.1-${{ github.sha }}
          path: build/libs/photon-forge-1.20.1-26.2.2.3.jar
          if-no-files-found: error
          retention-days: 30
