      # Round 21: LDLib2's DummyWorld.tickWorld() posted Forge's LevelTickEvent for the editor's virtual level and a
      # listener that casts event.level to ClientLevel (Brutality 0.8.7) crashed the FX editor with "Ticking screen".
      # The regression ticks an EditorSceneLevel and a plain TrackedDummyWorld with such a listener registered, so
      # this gate fails if either the editor level or the DummyWorldMixin lets the event reach the bus again.
      - name: Require LDLib2 virtual levels to stay off the Forge level tick bus
        shell: bash
        run: |
          grep -Fq '[virtual-level-tick-smoke] LDLib2 virtual levels post no Forge LevelTickEvent while a listener casts event.level to ClientLevel' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[virtual-level-tick] com.lowdragmc.lowdraglib2.utils.virtuallevel.TrackedDummyWorld is ticking inside a screen; Photon keeps Forge'"'"'s LevelTickEvent from being posted for LDLib2 virtual levels' "$RUNNER_TEMP/photon-client.log"

      # Round 22: FXHelper.getFX cached loaded effects but not failed loads, so a sub-emitter naming an effect that is
      # not on the instance walked every pack and logged a stack trace per particle it emitted (63 traces in six
      # minutes in a player's log). The regression asks for a missing id 200 times and runs such a sub-emitter for
      # ten ticks: one read, one log line, forgotten by invalidate/clearCache.
      - name: Require missing effects to be read and logged once
        shell: bash
        run: grep -Fq '[missing-effect-smoke] an effect id no pack provides is read and logged once, answered from memory afterwards and forgotten by a reload' "$RUNNER_TEMP/photon-client.log"

      # Round 22: in singleplayer the integrated server scans the client's own photon/fxpacks and offered the player
      # their exports back, which the client downloaded as server-<hash>.fxpack copies ("two random files"). The smoke
      # asks the integrated server for its list again once ci_watcher.fxpack is installed: the installed file must be
      # used in place and no server-<sha256> copy may appear.
      - name: Require installed packs to satisfy the server's offer without a copy
        shell: bash
        run: grep -Fq '[fxpack-local-twin-smoke] a pack the server offers that is already installed in photon/fxpacks is used in place, not downloaded as a server-<hash> copy' "$RUNNER_TEMP/photon-client.log"

      # Round 23: a pack replaced in the server's photon/fxpacks reached the players already online only through a
      # reconnect, a dimension change, a respawn or /photon fxpacks, and every version a client ever downloaded stayed
      # in its photon/fxpacks as a server-<hash> copy for good. The server now watches its folder and re-offers by
      # itself once a change holds still; the smoke rewrites the server-only fixture after the login sync and sends no
      # command: the client must download the new version, reload, serve the new content and drop the old copy.
      - name: Require a pack replaced on the server to reach online players by itself
        shell: bash
        run: |
          grep -Fq '[server-fxpack-watcher-smoke] a pack replaced, added or removed on the server is offered to the players online once it holds still, kept through the offer quota and never for a change that undid itself' "$RUNNER_TEMP/photon-client.log"
          grep -Fq "[fxpack-server-update-smoke] a pack replaced in the server's photon/fxpacks reached a playing client by itself: new version downloaded and mounted, old copy unmounted and removed, no command, reinstall or F3+T" "$RUNNER_TEMP/photon-client.log"
          grep -Fq 'Photon FX packs changed on the server (' "$RUNNER_TEMP/photon-client.log"

      # Round 24: none of the above may go through a resource reload any more. The server sync at login and on the
      # update, and the folder watcher for ci_watcher.fxpack, mount and unmount in the running resource manager; the
      # smoke counts the reloads Photon's reload listener sees from the watcher test on (zero), checks neither path
      # fell back to one, and that the replaced pack's sounds.json event was swapped in the sound manager.
      - name: Require packs to be mounted in place, without a resource reload
        shell: bash
        run: |
          grep -Fq "[fxpack-hot-mount-smoke] server packs at login and on update, and a pack copied into photon/fxpacks, were mounted and unmounted in the running resource manager with no resource reload; the new pack's sounds.json events were registered and the old pack's taken out" "$RUNNER_TEMP/photon-client.log"
          grep -Fq 'served in place, no resource reload' "$RUNNER_TEMP/photon-client.log"
          grep -Fq 'Server Photon FX packs are ready without a resource reload' "$RUNNER_TEMP/photon-client.log"
          if grep -Fq 'reloading client assets instead' "$RUNNER_TEMP/photon-client.log"; then
            echo '::error::a server FX pack sync fell back to a resource reload'
            exit 1
          fi

      # Round 25: an AMD Vega 11 (Windows driver) corrupted the terrain textures and hung the client in glfwSwapBuffers
      # the moment any FX appeared, with Photon as the only mod; no way to bisect on that machine. Photon now reads the
      # driver on the first frame and keeps a conservative GPU pipeline on AMD/Intel Windows drivers (gpu_profile =
      # AUTO; FULL/SAFE override), restores the texture state after every data-texture upload, counts glGetError per
      # pass, and a daemon thread writes photon/diagnostics/freeze-*.txt when the render thread stalls in a level. The
      # runner's llvmpipe must stay on the full pipeline (everything above still tests it), the regression pins the
      # detection, the profile's reach, the upload restore, the error counting and the report's contents.
      - name: Require the GPU compatibility profile, upload restore and freeze report
        shell: bash
        run: |
          grep -Fq '[gpu-compat-smoke] vendor=' "$RUNNER_TEMP/photon-client.log"
          grep -F '[gpu-compat-smoke] vendor=' "$RUNNER_TEMP/photon-client.log" | grep -Fq 'safeMode=false'
          grep -Fq '[freeze-watchdog-smoke] armed' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[gpu-compat-regression-smoke] AMD/Intel Windows drivers get the conservative profile, uploads restore the texture state, pass errors are counted and the freeze report is complete' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[gpu-error] stage=regression glGetError=0x500 (GL_INVALID_ENUM)' "$RUNNER_TEMP/photon-client.log"
          if grep -F '[gpu-error] stage=' "$RUNNER_TEMP/photon-client.log" | grep -Fv 'stage=regression' | grep -q .; then
            echo '::error::a Photon GPU pass raised a GL error on the runner:'
            grep -F '[gpu-error] stage=' "$RUNNER_TEMP/photon-client.log" | grep -Fv 'stage=regression'
            exit 1
          fi
          # The tick-30 regression batch runs in one client tick, longer than the threshold on llvmpipe: the watchdog
          # fires on a slow frame, not a hang. That is allowed, but the render thread does come back, so the report
          # must have been closed as RESOLVED (the INFO line below); a report left open on the runner is a bug.
          if grep -Fq '[freeze-watchdog] the render thread has produced no frame' "$RUNNER_TEMP/photon-client.log"; then
            echo '::warning::the freeze watchdog fired during the smoke run (llvmpipe stalls are slow frames, not GPU hangs):'
            grep -F '[freeze-watchdog]' "$RUNNER_TEMP/photon-client.log" | head -5
            grep -Fq '[freeze-watchdog] the render thread resumed after' "$RUNNER_TEMP/photon-client.log"
          fi

      # Round 26: "it was a mixin of Photon 1" was the user's diagnosis of the AMD freeze, and nothing in a log or a freeze
      # report could confirm or refute it (Mixin names its targets in debug.log only; a GPU hang writes no crash report).
      # Photon now logs, at client setup and into every freeze report, each registered mixin config with the mod file
      # that declares it, the configs on the render-path classes, and any other mod file shipping com.lowdragmc.photon
      # classes or Photon 1's photon-common.mixins.json. On the runner: Photon's own config must be seen on GameRenderer,
      # LDLib 1's on ParticleEngine next to it, and no old Photon anywhere.
      - name: Require the mixin audit
        shell: bash
        run: |
          grep -Fq '[mixin-audit-smoke] configs=' "$RUNNER_TEMP/photon-client.log"
          grep -F '[mixin-audit-smoke] configs=' "$RUNNER_TEMP/photon-client.log" | grep -Fq 'photon1Remnants=0 own=photon.mixins.json'
          # Photon's own hooks, and LDLib 1's ParticleEngineMixin next to Photon's on the same class: the foreign mixin
          # on the frame path the audit exists to show (read from Forge's scan of the mod files, not from a manifest)
          grep -F '[mixin-audit] render path: ' "$RUNNER_TEMP/photon-client.log" | grep -Eq 'GameRenderer <- [^;]*photon:GameRendererMixin'
          if ! grep -F '[mixin-audit] render path: ' "$RUNNER_TEMP/photon-client.log" | grep -Eq 'ParticleEngine <- [^;]*ldlib:ParticleEngineMixin[^;]*photon:ParticleEngineMixin'; then
            echo '::error::the mixin audit did not see LDLib 1 next to Photon on ParticleEngine in the development client:'
            grep -F '[mixin-audit] render path: ' "$RUNNER_TEMP/photon-client.log" | head -2
            exit 1
          fi
          # the audit itself, as annotations: a later round can read who was on the frame without the log
          grep -F '[mixin-audit' "$RUNNER_TEMP/photon-client.log" | sed -e 's/\r$//' -e 's/.*\(\[mixin-audit\)/\1/' | sort -u | while IFS= read -r line; do
            echo "::notice title=mixin audit::${line}"
          done
          grep -Fq '[mixin-audit] Photon 1: no other mod file ships com.lowdragmc.photon classes' "$RUNNER_TEMP/photon-client.log"
          grep -Fq "[mixin-audit-regression-smoke] a bundled Photon 1 is called out, the render-path line names every config on a class and the live audit sees Photon's own hooks" "$RUNNER_TEMP/photon-client.log"
          if grep -Fq '[mixin-audit] Photon 1 remnant' "$RUNNER_TEMP/photon-client.log"; then
            echo '::error::the mixin audit found an old Photon on the runner:'
            grep -F '[mixin-audit] Photon 1 remnant' "$RUNNER_TEMP/photon-client.log"
            exit 1
          fi

