name: Forge 1.20.1 build

on:
  pull_request:
    branches:
      - main
      - port/forge-1.20.1-2.2.9
  push:
    branches:
      - port/forge-1.20.1-2.2.9
      - port/forge-1.20.1-sync-sound
      - arena/747b04a3-photon-2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      distributable_uploaded: ${{ steps.distributable.outcome == 'success' }}
      forge_server_ok: ${{ steps.forge_server.outcome == 'success' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Kila preset registrations and translations
        run: python3 .github/scripts/verify_kila_preset_catalog.py

      - name: Verify Kila blend preset ordinals match the shader
        run: python3 .github/scripts/verify_kila_blend_ordinals.py

      - name: Verify shader normal and projection safety
        run: python3 .github/scripts/verify_shader_normal_safety.py

      - name: Verify language file parity
        run: python3 .github/scripts/verify_lang_parity.py

      - name: Verify referenced translation keys exist
        run: python3 .github/scripts/verify_lang_key_usage.py

      - name: Verify placeholder translation keys get their arguments
        run: python3 .github/scripts/verify_lang_placeholders.py

      - name: Verify floating-point formatting pins an explicit Locale
        run: python3 .github/scripts/verify_locale_safe_formatting.py

      - name: Verify config screen covers every top-level Photon setting
        run: python3 .github/scripts/verify_config_screen_coverage.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Forge mod
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon build 2>&1 | tee "$RUNNER_TEMP/photon-build.log"

      - name: Upload failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: photon-build-diagnostics
          path: ${{ runner.temp }}/photon-build.log
          if-no-files-found: ignore

      # Artifact downloads and raw job logs are unreachable from some environments (the blob storage
      # refuses them); check-run annotations are not, so a failed compile says what broke right there.
      - name: Publish compile errors as annotations
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/photon-build.log"
          [ -f "$log" ] || exit 0
          # first the compiler's own errors, then whatever the log ended on: a failure that is not a
          # javac error (a test, a plugin) still has to be readable without the log
          grep -E '\.java:[0-9]+: error|^e: |FAILURE:|What went wrong|Execution failed|Tests? .* failed|Could not |A problem occurred|Caused by' "$log" \
            | head -n 30 | while IFS= read -r line; do echo "::error title=build::$line"; done
          echo "::group::last 25 log lines"
          tail -n 25 "$log"
          echo "::endgroup::"

      - name: Verify packaged Photon mixin config and refmap
        shell: bash
        run: |
          jar_file=$(find build/libs -maxdepth 1 -name '*-all.jar' -print -quit)
          test -n "$jar_file"
          unzip -p "$jar_file" META-INF/MANIFEST.MF | grep -Eq '^MixinConfigs: .*photon.mixins.json'
          jar tf "$jar_file" | grep -Fxq 'photon.refmap.json'
          jar tf "$jar_file" | grep -Fxq 'com/lowdragmc/photon/core/mixins/iris/IrisRenderingPipelineAccessor.class'

      # What the -all jar carries must never export a package another mod can also export: the loader
      # builds one JPMS layer from every mod jar and two modules exporting one package stop the game
      # ("Modules thedarkcolour.kotlinforforge and kotlin.stdlib export package kotlin.contracts ...",
      # "Modules citadel and jaad.MILESTONE export package net.sourceforge.jaad.spi.javasound ..."). So:
      # LDLib2 ships as libs/ldlib2-2.2.39.a.jar, whose Kotlin runtime is relocated under
      # com.lowdragmc.photon.internal.embedded, and the audio codecs are relocated by shadowJar into the
      # same package instead of being nested. Every nested jar, two levels deep, is listed as a notice
      # annotation so an audit can read what the distributable carries without downloading it.
      - name: Verify the distributable isolates its embedded libraries
        shell: bash
        run: |
          jar_file=$(find build/libs -maxdepth 1 -name '*-all.jar' -print -quit)
          test -n "$jar_file"
          work="$RUNNER_TEMP/jarjar-audit"
          rm -rf "$work"
          mkdir -p "$work/level1" "$work/level2" "$work/classes"
          unzip -p "$jar_file" META-INF/jarjar/metadata.json > "$work/photon-metadata.json"
          python3 - "$work/photon-metadata.json" <<'PY'
          import json, sys
          jars = json.load(open(sys.argv[1]))["jars"]
          for jar in jars:
              ident = jar["identifier"]
              print("::notice title=jar-in-jar (photon)::%s:%s %s -> %s" % (ident["group"], ident["artifact"], jar["version"]["artifactVersion"], jar["path"]))
          idents = sorted(jar["identifier"]["group"] + ":" + jar["identifier"]["artifact"] for jar in jars)
          assert idents == ["local:kilagraph", "local:ldlib2"], "unexpected Jar-in-Jar set (codecs are relocated into the mod jar, never nested): %r" % idents
          ldlib2 = [jar for jar in jars if jar["identifier"]["artifact"] == "ldlib2"][0]
          assert ldlib2["path"] == "META-INF/jarjar/ldlib2-2.2.39.a.jar", "the JarJar pin resolved LDLib2 to %s, not the relocated libs/ldlib2-2.2.39.a.jar" % ldlib2["path"]
          PY
          # Package roots no module of ours may contain: the Kotlin runtime and the three codecs under
          # their original names. Listings go through files: `unzip | grep -q` under pipefail reports
          # grep's early exit as a failure.
          forbidden_roots='^(kotlin|kotlinx|net/sourceforge|javazoom|biniu)/'
          unzip -Z1 "$jar_file" > "$work/all.txt"
          for entry in \
            com/lowdragmc/photon/internal/embedded/jaad/aac/Decoder.class \
            com/lowdragmc/photon/internal/embedded/jaad/mp4/MP4Container.class \
            com/lowdragmc/photon/internal/embedded/javazoom/jl/decoder/Decoder.class \
            com/lowdragmc/photon/internal/embedded/javazoom/jl/decoder/l3reorder.ser \
            com/lowdragmc/photon/internal/embedded/biniu/vorbis/VorbisEnc.class \
            com/lowdragmc/photon/internal/embedded/biniu/ogg/StreamState.class \
            com/lowdragmc/photon/client/fx/timeline/AudioConverter.class \
            com/lowdragmc/photon/client/fx/timeline/OggVorbisWriter.class; do
            if ! grep -Fxq "$entry" "$work/all.txt"; then
              echo "::error title=relocated codecs::$entry is missing from the distributable"
              exit 1
            fi
          done
          if grep -Eq "$forbidden_roots" "$work/all.txt"; then
            echo "::error title=split package::the distributable carries a library under its original package root: $(grep -E "$forbidden_roots" "$work/all.txt" | head -n 3 | tr '\n' ' ')"
            exit 1
          fi
          if grep -Eq '^(module-info\.class|META-INF/versions/[0-9]+/module-info\.class|META-INF/services/javax\.sound\..*|META-INF/services/javazoom\..*)$' "$work/all.txt"; then
            echo "::error title=relocated codecs::a codec module descriptor or service registration leaked into the distributable"
            exit 1
          fi
          # Every class in the jar — Photon's and the relocated codecs' — may reference the codecs only
          # under the relocated package: an original name left in a constant pool is a NoClassDefFoundError
          # in production (dev runs the unrelocated originals and cannot notice).
          unzip -q -o "$jar_file" 'com/lowdragmc/photon/*.class' -d "$work/classes"
          python3 - "$work/classes" <<'PY'
          import os, re, struct, sys
          roots = re.compile(r'(?:^|L)(?:net/sourceforge/jaad|javazoom/jl|biniu/(?:ogg|vorbis)|kotlin/|kotlinx/)')
          def utf8_entries(data):
              n = struct.unpack('>H', data[8:10])[0]; i = 10; idx = 1
              while idx < n:
                  tag = data[i]; i += 1
                  if tag == 1:
                      l = struct.unpack('>H', data[i:i+2])[0]; i += 2
                      yield data[i:i+l].decode('utf-8', 'replace'); i += l
                  elif tag in (3, 4): i += 4
                  elif tag in (5, 6): i += 8; idx += 1
                  elif tag in (7, 8, 16, 19, 20): i += 2
                  elif tag in (9, 10, 11, 12, 17, 18): i += 4
                  elif tag == 15: i += 3
                  else: raise ValueError('constant pool tag %d' % tag)
                  idx += 1
          offenders = []
          scanned = 0
          for folder, _, files in os.walk(sys.argv[1]):
              for name in files:
                  if not name.endswith('.class'): continue
                  path = os.path.join(folder, name); scanned += 1
                  for entry in utf8_entries(open(path, 'rb').read()):
                      if roots.search(entry):
                          offenders.append('%s: %s' % (os.path.relpath(path, sys.argv[1]), entry[:120])); break
          print('scanned %d classes under com/lowdragmc/photon' % scanned)
          assert scanned > 500, 'the distributable holds too few Photon classes to be real'
          for line in offenders[:20]: print('::error title=unrelocated reference::' + line)
          assert not offenders, '%d classes still reference a codec or Kotlin under its original package' % len(offenders)
          PY
          unzip -q -o "$jar_file" 'META-INF/jarjar/*.jar' -d "$work/level1"
          offenders=0
          inspect() { # <jar> <label>: a nested jar may not carry a forbidden package root or a kotlin.* module name
            unzip -Z1 "$1" > "$work/listing.txt"
            if grep -Eq "$forbidden_roots" "$work/listing.txt"; then
              echo "::error title=split package::$2 carries $(grep -E "$forbidden_roots" "$work/listing.txt" | head -n 1 | cut -d/ -f1-2)/ under its original package root"
              offenders=$((offenders + 1))
            fi
            : > "$work/manifest.txt"
            if grep -Fxq 'META-INF/MANIFEST.MF' "$work/listing.txt"; then
              unzip -p "$1" META-INF/MANIFEST.MF | tr -d '\r' > "$work/manifest.txt"
            fi
            if grep -Eq '^Automatic-Module-Name: kotlin' "$work/manifest.txt"; then
              echo "::error title=split package::$2 declares a kotlin.* module name"
              offenders=$((offenders + 1))
            fi
          }
          for nested in "$work"/level1/META-INF/jarjar/*.jar; do
            name=$(basename "$nested")
            inspect "$nested" "$name"
            if grep -Fxq 'META-INF/jarjar/metadata.json' "$work/listing.txt"; then
              inner="$work/level2/${name%.jar}"
              mkdir -p "$inner"
              unzip -q -o "$nested" 'META-INF/jarjar/*' -d "$inner"
              for deep in "$inner"/META-INF/jarjar/*.jar; do
                [ -f "$deep" ] || continue
                echo "::notice title=jar-in-jar ($name)::$(basename "$deep") ($(stat -c %s "$deep") B)"
                inspect "$deep" "$name -> $(basename "$deep")"
              done
            fi
          done
          test "$offenders" -eq 0
          ldlib2_inner="$work/level2/ldlib2-2.2.39.a/META-INF/jarjar"
          test -f "$ldlib2_inner/metadata.json"
          grep -Fq '"artifact": "photon-kotlin-runtime"' "$ldlib2_inner/metadata.json"
          if grep -Fq 'kotlin-stdlib' "$ldlib2_inner/metadata.json"; then
            echo "::error title=split package::the embedded LDLib2 still declares kotlin-stdlib in its Jar-in-Jar metadata"
            exit 1
          fi
          runtime=$(find "$ldlib2_inner" -maxdepth 1 -name 'photon-kotlin-runtime-*.jar' -print -quit)
          test -n "$runtime"
          unzip -Z1 "$runtime" > "$work/listing.txt"
          grep -Fxq 'com/lowdragmc/photon/internal/embedded/kotlin/Unit.class' "$work/listing.txt"
          echo "Distributable: codecs relocated under com.lowdragmc.photon.internal.embedded, LDLib2 with $(basename "$runtime"); no library under its original package root."

      # Since round 19 the -all jar is assembled from shadowJar's content rather than from the main
      # output, and nothing in the dev runs (runClient/runServer, Gradle classpath) ever loads it. A
      # resource dropped on the way — mods.toml, the access transformer, pack.mcmeta, a shader — would
      # only show up on a player's instance, so every compiled class and every packaged resource must
      # be in the distributable, with mods.toml expanded.
      - name: Verify the distributable carries every class and packaged resource
        shell: bash
        run: |
          jar_file=$(find build/libs -maxdepth 1 -name '*-all.jar' -print -quit)
          test -n "$jar_file"
          python3 - "$jar_file" <<'PY'
          import os, sys, zipfile
          jar = zipfile.ZipFile(sys.argv[1])
          names = set(jar.namelist())
          roots = {"src/main/resources": None, "src/generated/resources": None,
                   "build/classes/java/main": ".class", "build/classes/java/irisAccessors": ".class"}
          counted, missing = {}, []
          for root, suffix in roots.items():
              counted[root] = 0
              for folder, _, files in os.walk(root):
                  for name in files:
                      if suffix and not name.endswith(suffix): continue
                      rel = os.path.relpath(os.path.join(folder, name), root).replace(os.sep, "/")
                      counted[root] += 1
                      if rel not in names: missing.append(rel)
          for line in missing[:20]: print("::error title=distributable incomplete::" + line)
          assert counted["src/main/resources"] > 150, "too few files under src/main/resources: %r" % counted
          assert counted["build/classes/java/main"] > 500, "too few compiled classes: %r" % counted
          assert counted["build/classes/java/irisAccessors"] >= 1, "the Iris accessor source set produced no class"
          assert not missing, "%d classes or resources are missing from the distributable" % len(missing)
          toml = jar.read("META-INF/mods.toml").decode("utf-8")
          assert 'modId="photon"' in toml.replace(" ", ""), "mods.toml lost its modId"
          assert "${" not in toml, "mods.toml was packaged without expanding its placeholders"
          for required in ("META-INF/accesstransformer.cfg", "pack.mcmeta", "photon.mixins.json", "photon.refmap.json",
                           "META-INF/jarjar/metadata.json", "META-INF/MANIFEST.MF", "icon.png"):
              assert required in names, required + " is missing from the distributable"
          print("Distributable carries every file: %s; %d entries in total." % (counted, len(names)))
          PY

      - name: Upload distributable
        id: distributable
        uses: actions/upload-artifact@v4
        with:
          name: photon-forge-1.20.1
          path: build/libs/*-all.jar
          if-no-files-found: error
          retention-days: 90

      # The dev smokes further down run from the Gradle classpath, where the embedded libraries are
      # loose jars and the JPMS layer the loader builds from a mods folder never exists. Both start-up
      # crashes reported from real instances (rounds 18 and 19) lived only in that layer: Photon's
      # nested jars exported kotlin.* and net.sourceforge.jaad.* next to Kotlin for Forge and Citadel.
      # So the distributable itself is installed on a real Forge server together with LDLib 1 and the
      # newest Forge 1.20.1 builds of those two mods (Modrinth), and must reach the ready prompt with
      # every mod file — the nested ones included — loaded. The artifact above stays available for
      # inspection either way, but publish-preview requires this step: a jar that cannot start next
      # to them is never handed out as a preview.
      - name: Smoke-test the distributable on a Forge server next to Kotlin for Forge and Citadel
        id: forge_server
        shell: bash
        env:
          MODRINTH_COMPANIONS: kotlin-for-forge citadel
        run: |
          jar_file=$(find build/libs -maxdepth 1 -name '*-all.jar' -print -quit)
          test -n "$jar_file"
          mc_version=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r[:space:]')
          forge_version=$(sed -n 's/^forge_version=//p' gradle.properties | tr -d '\r[:space:]')
          forge="$mc_version-$forge_version"
          work="$RUNNER_TEMP/forge-server"
          rm -rf "$work"
          mkdir -p "$work/mods"
          ua='Santi-PdR/Photon-2 CI (https://github.com/Santi-PdR/Photon-2)'
          curl -fsSL --retry 5 --retry-delay 5 -A "$ua" -o "$work/installer.jar" \
            "https://maven.minecraftforge.net/net/minecraftforge/forge/$forge/forge-$forge-installer.jar"
          if ! (cd "$work" && timeout 600s java -jar installer.jar --installServer "$work" > install.log 2>&1); then
            tail -n 40 "$work/install.log"
            echo "::error title=forge server::the Forge $forge server installer failed"
            exit 1
          fi
          test -f "$work/libraries/net/minecraftforge/forge/$forge/unix_args.txt"
          cp "$jar_file" "$work/mods/"
          cp libs/ldlib1-1.0.52.a.jar "$work/mods/"
          for project in $MODRINTH_COMPANIONS; do
            curl -fsSL --retry 5 --retry-delay 5 -A "$ua" -o "$work/$project.json" \
              "https://api.modrinth.com/v2/project/$project/version"
            python3 - "$work/$project.json" "$work/$project.pick" "$mc_version" <<'PY'
          import json, sys
          mc = sys.argv[3]
          versions = [v for v in json.load(open(sys.argv[1])) if "forge" in v["loaders"] and mc in v["game_versions"]]
          assert versions, "Modrinth lists no Forge %s build of this project" % mc
          versions.sort(key=lambda v: v["date_published"], reverse=True)
          version = ([v for v in versions if v["version_type"] == "release"] or versions)[0]
          file = ([f for f in version["files"] if f.get("primary")] or version["files"])[0]
          assert file["filename"].endswith(".jar"), file["filename"]
          open(sys.argv[2], "w").write("%s %s %s\n" % (file["url"], file["filename"], version["version_number"]))
          PY
            read -r url file version < "$work/$project.pick"
            curl -fsSL --retry 5 --retry-delay 5 -A "$ua" -o "$work/mods/$file" "$url"
            # a mod (mods.toml) or a language provider / game library (FMLModType in the manifest):
            # Kotlin for Forge's -all jar is a LANGPROVIDER whose mods.toml lives in a nested jar
            unzip -Z1 "$work/mods/$file" > "$work/listing.txt"
            unzip -p "$work/mods/$file" META-INF/MANIFEST.MF 2>/dev/null | tr -d '\r' > "$work/manifest.txt" || true
            if ! grep -Fxq 'META-INF/mods.toml' "$work/listing.txt" && ! grep -q '^FMLModType:' "$work/manifest.txt"; then
              echo "::error title=companion mod::$file from Modrinth ($project $version) is neither a mod nor an FML library jar"
              exit 1
            fi
            echo "::notice title=companion mod::$project $version ($file, $(stat -c %s "$work/mods/$file") B)"
          done
          printf 'eula=true\n' > "$work/eula.txt"
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nview-distance=3\nsimulation-distance=3\nspawn-protection=0\nmax-players=1\nserver-port=25599\nsync-chunk-writes=false\n' > "$work/server.properties"
          log="$work/server.log"
          # The loader's "Found mod file … of type … with provider …" lines carry the SCAN marker, which
          # Forge's log4j2.xml denies everywhere by default; they are the record of what was loaded.
          (cd "$work" && exec java -Dforge.logging.marker.scan=ACCEPT @user_jvm_args.txt "@libraries/net/minecraftforge/forge/$forge/unix_args.txt" nogui) > "$log" 2>&1 < /dev/null &
          pid=$!
          ready=0
          for _ in $(seq 1 72); do
            sleep 5
            if grep -Fq 'For help, type "help"' "$log"; then ready=1; break; fi
            kill -0 "$pid" 2>/dev/null || break
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill -INT "$pid" 2>/dev/null || true
            for _ in $(seq 1 12); do kill -0 "$pid" 2>/dev/null || break; sleep 5; done
            kill -KILL "$pid" 2>/dev/null || true
          fi
          wait "$pid" 2>/dev/null || true
          tr -d '\000' < "$log" > "$log.clean" && mv "$log.clean" "$log"
          # console output plus the loader's debug log: the mod-file record is read from both
          cat "$log" "$work"/logs/debug.log > "$work/all.log" 2>/dev/null || cp "$log" "$work/all.log"
          grep -aE 'Found mod file|Found [0-9]+ dependencies|Loading [0-9]+ mods' "$work/all.log" | sort -u > "$work/found.txt" || true
          echo "::group::mod files the loader found"
          cat "$work/found.txt"
          echo "::endgroup::"
          grep -aE '/(WARN|ERROR|FATAL)\]' "$log" | grep -aiE 'photon|ldlib|kila|kotlin|citadel|jaad|module|mixin' \
            | sed -E 's/^\[[^]]*\] \[[^]]*\]:? ?//' | sort | uniq -c | sort -rn | head -n 30 > "$work/warnings.txt" || true
          if [ -s "$work/warnings.txt" ]; then
            echo "::group::WARN/ERROR lines mentioning the libraries"
            cat "$work/warnings.txt"
            echo "::endgroup::"
            encoded=$(sed 's/%/%25/g' "$work/warnings.txt" | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-3900)
            echo "::notice title=forge server WARN/ERROR summary::$encoded"
          fi
          fail=0
          if [ "$ready" -ne 1 ]; then
            echo "::error title=forge server::the distributable did not bring the Forge $forge server to its ready prompt"
            fail=1
          fi
          # Loader-level failures, plus a missing class under one of our own package roots (an unrelocated
          # reference, or a relocated class the jar lost); other mods' optional-class probes are not ours.
          grep -aE 'java\.lang\.module\.ResolutionException|java\.lang\.LayerInstantiationException|Incompatible mod set|Missing or unsupported mandatory dependencies|Exception in thread "main"|MixinApplyError|InvalidInjectionException|ModLoadingException|Encountered an exception during mod loading|(NoClassDefFoundError|ClassNotFoundException): ?(com[./]lowdragmc|kotlin|javazoom|biniu|net[./]sourceforge)' "$log" > "$work/fatal.txt" || true
          if [ -s "$work/fatal.txt" ]; then
            head -n 10 "$work/fatal.txt" | while IFS= read -r line; do echo "::error title=forge server::$line"; done
            fail=1
          fi
          for needle in \
            "Found mod file $(basename "$jar_file") of type MOD" \
            'Found mod file ldlib2-2.2.39.a.jar of type MOD' \
            'Found mod file kilagraph-20.1.0.15.jar of type MOD' \
            'Found mod file photon-kotlin-runtime-2.2.21.jar of type' \
            'Found mod file ldlib1-1.0.52.a.jar of type MOD' \
            'Photon is initializing on platform'; do
            if ! grep -Fq "$needle" "$work/all.log"; then
              echo "::error title=forge server::missing from the server log: $needle"
              fail=1
            fi
          done
          for companion in "$work"/mods/*.jar; do
            if ! grep -Fq "Found mod file $(basename "$companion") of type" "$work/all.log"; then
              echo "::error title=forge server::the loader never picked up $(basename "$companion")"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::group::last 60 server log lines"
            tail -n 60 "$log"
            echo "::endgroup::"
            for report in "$work"/crash-reports/*.txt; do
              [ -f "$report" ] || continue
              echo "::group::$(basename "$report")"
              head -n 80 "$report"
              echo "::endgroup::"
            done
            exit 1
          fi
          ready_line=$(grep -F 'For help, type "help"' "$log" | head -n 1 | sed -E 's/^\[[^]]*\] \[[^]]*\]:? ?//')
          echo "::notice title=forge server::$(basename "$jar_file") reached the ready prompt on Forge $forge next to $(ls "$work/mods" | grep -v photon-forge | tr '\n' ' ')($ready_line)"

      - name: Smoke-test dedicated Forge server startup
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          log_file="$RUNNER_TEMP/photon-server.log"
          set +e
          timeout --signal=INT --kill-after=15s 180s bash ./gradlew --no-daemon runServer > "$log_file" 2>&1
          result=$?
          tr -d '\000' < "$log_file" > "$log_file.clean" && mv "$log_file.clean" "$log_file"
          if grep -Fq 'For help, type "help"' "$log_file"; then
            echo "Forge server reached the ready state."
            exit 0
          fi
          grep -n -E -C 3 'ERROR|FATAL|Exception|Caused by:|fxproj|smoke|Game crashed|BUILD FAILED|Failed to (load|recompile)' "$log_file" | tail -n 240 || true
          # Surface the failure even when the Actions log archive cannot be downloaded.
          grep -E 'ERROR|FATAL|Exception|Caused by:|BUILD FAILED|What went wrong|Execution failed' "$log_file" | tail -n 25 | while IFS= read -r line; do
            echo "::error title=server startup::$line"
          done
          echo "::error title=server startup::Server exited with status $result before reaching the ready state."
          echo "Forge server exited with status $result before reaching the ready state." >&2
          exit 1

      - name: Prepare a world for the editor smoke test
        shell: bash
        run: |
          test -s run/world/level.dat
          mkdir -p run/saves
          cp -a run/world run/saves/PhotonCI
          rm -f run/saves/PhotonCI/session.lock
          mkdir -p run/ldlib2/assets
