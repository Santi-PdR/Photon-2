name: Forge 1.20.1 build

on:
  pull_request:
    branches:
      - main
      - port/forge-1.20.1-2.2.9
  push:
    branches:
      - port/forge-1.20.1-2.2.9
      - port/forge-1.20.1-sync-sound
      - arena/747b04a3-photon-2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      distributable_uploaded: ${{ steps.distributable.outcome == 'success' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Kila preset registrations and translations
        run: python3 .github/scripts/verify_kila_preset_catalog.py

      - name: Verify Kila blend preset ordinals match the shader
        run: python3 .github/scripts/verify_kila_blend_ordinals.py

      - name: Verify shader normal and projection safety
        run: python3 .github/scripts/verify_shader_normal_safety.py

      - name: Verify language file parity
        run: python3 .github/scripts/verify_lang_parity.py

      - name: Verify referenced translation keys exist
        run: python3 .github/scripts/verify_lang_key_usage.py

      - name: Verify placeholder translation keys get their arguments
        run: python3 .github/scripts/verify_lang_placeholders.py

      - name: Verify floating-point formatting pins an explicit Locale
        run: python3 .github/scripts/verify_locale_safe_formatting.py

      - name: Verify config screen covers every top-level Photon setting
        run: python3 .github/scripts/verify_config_screen_coverage.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Forge mod
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon build 2>&1 | tee "$RUNNER_TEMP/photon-build.log"

      - name: Upload failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: photon-build-diagnostics
          path: ${{ runner.temp }}/photon-build.log
          if-no-files-found: ignore

      # Artifact downloads and raw job logs are unreachable from some environments (the blob storage
      # refuses them); check-run annotations are not, so a failed compile says what broke right there.
      - name: Publish compile errors as annotations
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/photon-build.log"
          [ -f "$log" ] || exit 0
          # first the compiler's own errors, then whatever the log ended on: a failure that is not a
          # javac error (a test, a plugin) still has to be readable without the log
          grep -E '\.java:[0-9]+: error|^e: |FAILURE:|What went wrong|Execution failed|Tests? .* failed|Could not |A problem occurred|Caused by' "$log" \
            | head -n 30 | while IFS= read -r line; do echo "::error title=build::$line"; done
          echo "::group::last 25 log lines"
          tail -n 25 "$log"
          echo "::endgroup::"

      - name: Verify packaged Photon mixin config and refmap
        shell: bash
        run: |
          jar_file=$(find build/libs -maxdepth 1 -name '*-all.jar' -print -quit)
          test -n "$jar_file"
          unzip -p "$jar_file" META-INF/MANIFEST.MF | grep -Eq '^MixinConfigs: .*photon.mixins.json'
          jar tf "$jar_file" | grep -Fxq 'photon.refmap.json'
          jar tf "$jar_file" | grep -Fxq 'com/lowdragmc/photon/core/mixins/iris/IrisRenderingPipelineAccessor.class'

      # What the -all jar carries must never export a package another mod can also export: the loader
      # builds one JPMS layer from every mod jar and two modules exporting one package stop the game
      # ("Modules thedarkcolour.kotlinforforge and kotlin.stdlib export package kotlin.contracts ...",
      # "Modules citadel and jaad.MILESTONE export package net.sourceforge.jaad.spi.javasound ..."). So:
      # LDLib2 ships as libs/ldlib2-2.2.39.a.jar, whose Kotlin runtime is relocated under
      # com.lowdragmc.photon.internal.embedded, and the audio codecs are relocated by shadowJar into the
      # same package instead of being nested. Every nested jar, two levels deep, is listed as a notice
      # annotation so an audit can read what the distributable carries without downloading it.
      - name: Verify the distributable isolates its embedded libraries
        shell: bash
        run: |
          jar_file=$(find build/libs -maxdepth 1 -name '*-all.jar' -print -quit)
          test -n "$jar_file"
          work="$RUNNER_TEMP/jarjar-audit"
          rm -rf "$work"
          mkdir -p "$work/level1" "$work/level2" "$work/classes"
          unzip -p "$jar_file" META-INF/jarjar/metadata.json > "$work/photon-metadata.json"
          python3 - "$work/photon-metadata.json" <<'PY'
          import json, sys
          jars = json.load(open(sys.argv[1]))["jars"]
          for jar in jars:
              ident = jar["identifier"]
              print("::notice title=jar-in-jar (photon)::%s:%s %s -> %s" % (ident["group"], ident["artifact"], jar["version"]["artifactVersion"], jar["path"]))
          idents = sorted(jar["identifier"]["group"] + ":" + jar["identifier"]["artifact"] for jar in jars)
          assert idents == ["local:kilagraph", "local:ldlib2"], "unexpected Jar-in-Jar set (codecs are relocated into the mod jar, never nested): %r" % idents
          ldlib2 = [jar for jar in jars if jar["identifier"]["artifact"] == "ldlib2"][0]
          assert ldlib2["path"] == "META-INF/jarjar/ldlib2-2.2.39.a.jar", "the JarJar pin resolved LDLib2 to %s, not the relocated libs/ldlib2-2.2.39.a.jar" % ldlib2["path"]
          PY
          # Package roots no module of ours may contain: the Kotlin runtime and the three codecs under
          # their original names. Listings go through files: `unzip | grep -q` under pipefail reports
          # grep's early exit as a failure.
          forbidden_roots='^(kotlin|kotlinx|net/sourceforge|javazoom|biniu)/'
          unzip -Z1 "$jar_file" > "$work/all.txt"
          for entry in \
            com/lowdragmc/photon/internal/embedded/jaad/aac/Decoder.class \
            com/lowdragmc/photon/internal/embedded/jaad/mp4/MP4Container.class \
            com/lowdragmc/photon/internal/embedded/javazoom/jl/decoder/Decoder.class \
            com/lowdragmc/photon/internal/embedded/javazoom/jl/decoder/l3reorder.ser \
            com/lowdragmc/photon/internal/embedded/biniu/vorbis/VorbisEnc.class \
            com/lowdragmc/photon/internal/embedded/biniu/ogg/StreamState.class \
            com/lowdragmc/photon/client/fx/timeline/AudioConverter.class \
            com/lowdragmc/photon/client/fx/timeline/OggVorbisWriter.class; do
            if ! grep -Fxq "$entry" "$work/all.txt"; then
              echo "::error title=relocated codecs::$entry is missing from the distributable"
              exit 1
            fi
          done
          if grep -Eq "$forbidden_roots" "$work/all.txt"; then
            echo "::error title=split package::the distributable carries a library under its original package root: $(grep -E "$forbidden_roots" "$work/all.txt" | head -n 3 | tr '\n' ' ')"
            exit 1
          fi
          if grep -Eq '^(module-info\.class|META-INF/versions/[0-9]+/module-info\.class|META-INF/services/javax\.sound\..*|META-INF/services/javazoom\..*)$' "$work/all.txt"; then
            echo "::error title=relocated codecs::a codec module descriptor or service registration leaked into the distributable"
            exit 1
          fi
          # Every class in the jar — Photon's and the relocated codecs' — may reference the codecs only
          # under the relocated package: an original name left in a constant pool is a NoClassDefFoundError
          # in production (dev runs the unrelocated originals and cannot notice).
          unzip -q -o "$jar_file" 'com/lowdragmc/photon/*.class' -d "$work/classes"
          python3 - "$work/classes" <<'PY'
          import os, re, struct, sys
          roots = re.compile(r'(?:^|L)(?:net/sourceforge/jaad|javazoom/jl|biniu/(?:ogg|vorbis)|kotlin/|kotlinx/)')
          def utf8_entries(data):
              n = struct.unpack('>H', data[8:10])[0]; i = 10; idx = 1
              while idx < n:
                  tag = data[i]; i += 1
                  if tag == 1:
                      l = struct.unpack('>H', data[i:i+2])[0]; i += 2
                      yield data[i:i+l].decode('utf-8', 'replace'); i += l
                  elif tag in (3, 4): i += 4
                  elif tag in (5, 6): i += 8; idx += 1
                  elif tag in (7, 8, 16, 19, 20): i += 2
                  elif tag in (9, 10, 11, 12, 17, 18): i += 4
                  elif tag == 15: i += 3
                  else: raise ValueError('constant pool tag %d' % tag)
                  idx += 1
          offenders = []
          scanned = 0
          for folder, _, files in os.walk(sys.argv[1]):
              for name in files:
                  if not name.endswith('.class'): continue
                  path = os.path.join(folder, name); scanned += 1
                  for entry in utf8_entries(open(path, 'rb').read()):
                      if roots.search(entry):
                          offenders.append('%s: %s' % (os.path.relpath(path, sys.argv[1]), entry[:120])); break
          print('scanned %d classes under com/lowdragmc/photon' % scanned)
          assert scanned > 500, 'the distributable holds too few Photon classes to be real'
          for line in offenders[:20]: print('::error title=unrelocated reference::' + line)
          assert not offenders, '%d classes still reference a codec or Kotlin under its original package' % len(offenders)
          PY
          unzip -q -o "$jar_file" 'META-INF/jarjar/*.jar' -d "$work/level1"
          offenders=0
          inspect() { # <jar> <label>: a nested jar may not carry a forbidden package root or a kotlin.* module name
            unzip -Z1 "$1" > "$work/listing.txt"
            if grep -Eq "$forbidden_roots" "$work/listing.txt"; then
              echo "::error title=split package::$2 carries $(grep -E "$forbidden_roots" "$work/listing.txt" | head -n 1 | cut -d/ -f1-2)/ under its original package root"
              offenders=$((offenders + 1))
            fi
            : > "$work/manifest.txt"
            if grep -Fxq 'META-INF/MANIFEST.MF' "$work/listing.txt"; then
              unzip -p "$1" META-INF/MANIFEST.MF | tr -d '\r' > "$work/manifest.txt"
            fi
            if grep -Eq '^Automatic-Module-Name: kotlin' "$work/manifest.txt"; then
              echo "::error title=split package::$2 declares a kotlin.* module name"
              offenders=$((offenders + 1))
            fi
          }
          for nested in "$work"/level1/META-INF/jarjar/*.jar; do
            name=$(basename "$nested")
            inspect "$nested" "$name"
            if grep -Fxq 'META-INF/jarjar/metadata.json' "$work/listing.txt"; then
              inner="$work/level2/${name%.jar}"
              mkdir -p "$inner"
              unzip -q -o "$nested" 'META-INF/jarjar/*' -d "$inner"
              for deep in "$inner"/META-INF/jarjar/*.jar; do
                [ -f "$deep" ] || continue
                echo "::notice title=jar-in-jar ($name)::$(basename "$deep") ($(stat -c %s "$deep") B)"
                inspect "$deep" "$name -> $(basename "$deep")"
              done
            fi
          done
          test "$offenders" -eq 0
          ldlib2_inner="$work/level2/ldlib2-2.2.39.a/META-INF/jarjar"
          test -f "$ldlib2_inner/metadata.json"
          grep -Fq '"artifact": "photon-kotlin-runtime"' "$ldlib2_inner/metadata.json"
          if grep -Fq 'kotlin-stdlib' "$ldlib2_inner/metadata.json"; then
            echo "::error title=split package::the embedded LDLib2 still declares kotlin-stdlib in its Jar-in-Jar metadata"
            exit 1
          fi
          runtime=$(find "$ldlib2_inner" -maxdepth 1 -name 'photon-kotlin-runtime-*.jar' -print -quit)
          test -n "$runtime"
          unzip -Z1 "$runtime" > "$work/listing.txt"
          grep -Fxq 'com/lowdragmc/photon/internal/embedded/kotlin/Unit.class' "$work/listing.txt"
          echo "Distributable: codecs relocated under com.lowdragmc.photon.internal.embedded, LDLib2 with $(basename "$runtime"); no library under its original package root."

      - name: Upload distributable
        id: distributable
        uses: actions/upload-artifact@v4
        with:
          name: photon-forge-1.20.1
          path: build/libs/*-all.jar
          if-no-files-found: error
          retention-days: 90

      - name: Smoke-test dedicated Forge server startup
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          log_file="$RUNNER_TEMP/photon-server.log"
          set +e
          timeout --signal=INT --kill-after=15s 180s bash ./gradlew --no-daemon runServer > "$log_file" 2>&1
          result=$?
          tr -d '\000' < "$log_file" > "$log_file.clean" && mv "$log_file.clean" "$log_file"
          if grep -Fq 'For help, type "help"' "$log_file"; then
            echo "Forge server reached the ready state."
            exit 0
          fi
          grep -n -E -C 3 'ERROR|FATAL|Exception|Caused by:|fxproj|smoke|Game crashed|BUILD FAILED|Failed to (load|recompile)' "$log_file" | tail -n 240 || true
          # Surface the failure even when the Actions log archive cannot be downloaded.
          grep -E 'ERROR|FATAL|Exception|Caused by:|BUILD FAILED|What went wrong|Execution failed' "$log_file" | tail -n 25 | while IFS= read -r line; do
            echo "::error title=server startup::$line"
          done
          echo "::error title=server startup::Server exited with status $result before reaching the ready state."
          echo "Forge server exited with status $result before reaching the ready state." >&2
          exit 1

      - name: Prepare a world for the editor smoke test
        shell: bash
        run: |
          test -s run/world/level.dat
          mkdir -p run/saves
          cp -a run/world run/saves/PhotonCI
          rm -f run/saves/PhotonCI/session.lock
          mkdir -p run/ldlib2/assets
          mkdir -p run/ldlib/assets/photon_legacy_probe/textures
          mkdir -p run/photon/assets/photon_workspace_probe/textures
          printf 'legacy-pack-mounted' > run/ldlib/assets/photon_legacy_probe/textures/marker.txt
          printf 'photon-workspace-assets-mounted' > run/photon/assets/photon_workspace_probe/textures/marker.txt
          cp -a ci-fixtures/real-scan/ldlib2/assets/. run/ldlib2/assets/
          cp -a ci-fixtures/real-tornado/ldlib2/assets/. run/ldlib2/assets/
          cp -a ci-fixtures/real-shield-trail/ldlib2/assets/. run/ldlib2/assets/
          mkdir -p run/ldlib2/projects
          find run/ldlib2/assets -maxdepth 1 -name '*.fxproj' -exec mv -t run/ldlib2/projects {} +
          mkdir -p run/photon/fxpacks
          python3 - <<'PY'
          from zipfile import ZIP_DEFLATED, ZipFile
          with ZipFile("run/photon/fxpacks/server-ci-server-sync.fxpack", "w", ZIP_DEFLATED) as pack:
              pack.writestr("assets/photon_sync_probe/fx/server_sync.fx", b"server fx pack sync probe")
              pack.writestr("assets/photon_sync_probe/textures/server_sync_marker.txt", b"delivered only by the integrated server")
          PY

      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth libgl1-mesa-dri libglx-mesa0 python3-pil ffmpeg

      - name: Generate audio conversion smoke fixtures
        run: |
          mkdir -p run/photon/smoke-fixtures
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=0.5" -ac 2 -c:a libmp3lame -b:a 128k run/photon/smoke-fixtures/beat.mp3
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=0.5" -ac 2 -c:a aac -b:a 128k run/photon/smoke-fixtures/beat.m4a
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=0.5" -ac 2 -ar 48000 run/photon/smoke-fixtures/beat48k.wav
          ffmpeg -loglevel error -f lavfi -i "testsrc=size=64x64:duration=0.5" -f lavfi -i "sine=frequency=440:duration=0.5" -ac 2 -c:v libx264 -c:a aac -shortest run/photon/smoke-fixtures/beat.mp4

      # The dev-run smoke tests below exercise the original codec libraries from the Gradle classpath;
      # only the packaged jar carries the copies shadowJar relocated under
      # com.lowdragmc.photon.internal.embedded. Decode and encode with those, compiled against the
      # distributable alone, so a relocation that lost a class, a resource or a reference fails here.
      - name: Exercise the relocated audio codecs from the distributable
        shell: bash
        run: |
          jar_file=$(find build/libs -maxdepth 1 -name '*-all.jar' -print -quit)
          test -n "$jar_file"
          work="$RUNNER_TEMP/relocated-codecs"
          rm -rf "$work"
          mkdir -p "$work/classes"
          cp run/photon/smoke-fixtures/beat.mp3 run/photon/smoke-fixtures/beat.m4a "$work/"
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=0.5" -ac 2 -c:a aac -b:a 128k -f adts "$work/beat.aac"
          javac -d "$work/classes" -cp "$jar_file" .github/scripts/RelocatedCodecsCheck.java
          if ! java -cp "$work/classes:$jar_file" RelocatedCodecsCheck "$work" > "$work/check.log" 2>&1; then
            cat "$work/check.log"
            # the whole trace as annotations: the step log is not always reachable from where this is read
            grep -E 'STAGE FAILED|Exception|Error|^\s+at (com\.lowdragmc|RelocatedCodecsCheck)' "$work/check.log" > "$work/trace.txt" || true
            head -n 24 "$work/trace.txt" | while IFS= read -r line; do
              echo "::error title=relocated codecs::$line"
            done
            echo "::error title=relocated codecs::the relocated jLayer/JAAD/jVorbisEnc inside the distributable failed"
            exit 1
          fi
          cat "$work/check.log"
          # What the relocated encoder wrote must be Ogg Vorbis to an independent decoder as well
          # (mono: AudioConverter always downmixes before encoding, and so does the check).
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -of default=nw=1 "$work/relocated.ogg" > "$work/probe.txt"
          cat "$work/probe.txt"
          grep -Fxq 'codec_name=vorbis' "$work/probe.txt"
          grep -Fxq 'sample_rate=44100' "$work/probe.txt"
          grep -Fxq 'channels=1' "$work/probe.txt"
          ffmpeg -v error -xerror -i "$work/relocated.ogg" -f null -
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$work/relocated.ogg")
          python3 -c 'import sys; d = float(sys.argv[1]); assert 0.3 <= d <= 0.9, "relocated.ogg lasts %s s" % d' "$duration"
          echo "::notice title=relocated codecs::$(tail -n 1 "$work/check.log")"

      - name: Smoke-test Forge client startup without a physical display
        shell: bash
        run: |
          log_file="$RUNNER_TEMP/photon-client.log"
          set +e
          timeout --signal=INT --kill-after=15s 240s xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24 +extension GLX +render -noreset" env LIBGL_ALWAYS_SOFTWARE=1 ALSOFT_DRIVERS=null JAVA_TOOL_OPTIONS="-Dmixin.debug.verbose=true -Dphoton.fxprojSmokeTest=true -Dphoton.serverFxPackSyncSmoke=true" bash ./gradlew --no-daemon runClient > "$log_file" 2>&1
          result=$?
          # Some crashes dump binary bytes into stdout and grep then hides every diagnostic as
          # "binary file matches". Strip NULs so all later greps treat the log as text.
          tr -d '\000' < "$log_file" > "$log_file.clean" && mv "$log_file.clean" "$log_file"
          required_markers=(
            'Photon shader graph nodes loaded:'
            'Sound engine started'
            'ParticleEngineAccessor'
            'photon.mixins.json'
            '[bloom-smoke] red FX halo is present while non-highlight scene pixels stay intact'
            '[fx-picker-smoke] the fx search lists every loadable effect'
            '[fx-instance-timeline-history-smoke] inspector snapshots persist FX instance timelines without crashing'
            '[bloom-control-smoke] dragging the scene bar'
            '[slider-drag-smoke] pressing and dragging the bloom slider moved it continuously'
            '[editor-open] FXEditor built in'
            '[material-reference-cycle-smoke] resource material chains resolve and cycles fall back safely'
            '[material-persistence-smoke] created materials persist on disk and travel inside the project file'
            '[fxpack-stall-watchdog-smoke] stalled server pack transfers are swept and live ones survive'
            '[fxpack-watcher-smoke] copied, same-size replaced and removed packs each owe one reload once they stop changing, kept until a reload covers it'
            '[fxpack-watcher-mount-smoke] a pack copied into photon/fxpacks was mounted by the folder watcher without F3+T'
            '[upload-archive-smoke] the local LDLib2 asset archive skips unsafe names and passes pack validation'
            '[late-replay-smoke] entity and block FX snapshots replay with their fields and per-chunk filtering'
            '[audio-conversion-smoke] user audio formats convert to playable mono Ogg Vorbis'
            '[sound-length-smoke] an imported sound reports its measured length once asked to wait for it instead of 0 on the first ask'
            '[dialog-size-close-smoke] a window-mode dialog stores the size it had on screen when it closes, and a damaged 0x0 entry reads as no entry'
            '[kotlin-runtime-isolation-smoke] LDLib2'"'"'s Kotlin classes link only against the relocated runtime under com.lowdragmc.photon.internal.embedded and it loads'
            '[kila-texture-assets-smoke] all '
            '[kila-material-sanitize-smoke] corrupt driver and texture enum values fall back safely'
            '[kila-preset-resources-smoke] '
            '[kila-preset-shaders-smoke] all '
            '[kila-flipbook-sheets-smoke] '
            '[kila-preset-serialization-smoke] all '
            '[builtin-material-picker-smoke] Kila and all built-in material presets are listed in the material selector'
            '[trail-fast-movement-smoke] high-speed trail movement is sub-sampled with a 64-point cap'
            '[trail-colour-smoke] red-to-blue trail gradient reaches both GPU/CPU point colours'
            '[fxproj-smoke] loaded synthetic .fxproj with burst'
            '[fxproj-legacy-smoke] loaded Photon 26.2 managed-list .fxproj and preserved burst fields'
            '[photon1-editor-project-smoke] opened both raw Photon 1 .fxproj layouts and preserved the originals'
            '[editor-assets-smoke] loaded Photon workspace assets and Photon 1/2 legacy assets'
            '[mixin-smoke] ParticleEngine accessor path is callable'
            '[obj-loader-compat] registered neoforge:obj using Forge'
            '[obj-model-smoke] parsed neoforge:obj through Forge and built'
            '[loose-ldlib2-obj-smoke] adopted dropped OBJ, its MTL, and '
            '[fxproj-editor-smoke] opened v3 managed-list project and previewed'
            '[tornado-render-smoke] loaded LDLib2 OBJ with legacy UV/brightness attributes'
            '[screen-size-smoke] custom GPU model shader rendered using framebuffer-sized ScreenSize'
            '[shader-compat-smoke] compiled two-argument fog shader and instanced variant'
            '[mesh-cache-smoke] nested load and invalidation with colliding keys succeeded'
          )
          missing_markers=()
          for marker in "${required_markers[@]}"; do
            grep -Fq "$marker" "$log_file" || missing_markers+=("$marker")
          done
          forbidden_patterns=('FATAL' 'MixinApplyError' 'InvalidInjectionException' 'ClassCastException' 'Failed to recompile shader' 'Failed to load model')
          forbidden_matches=()
          for pattern in "${forbidden_patterns[@]}"; do
            grep -Fq "$pattern" "$log_file" && forbidden_matches+=("$pattern")
          done
          if ((${#missing_markers[@]} == 0 && ${#forbidden_matches[@]} == 0)); then
            grep -E '\[.*smoke\]|\[obj-loader-compat\]' "$log_file" || true
            echo "Photon client setup and the Minecraft sound engine reached the ready state (exit $result after timeout)."
            exit 0
          fi
          for marker in "${missing_markers[@]}"; do
            echo "::error title=missing client smoke marker::$marker"
          done
          for pattern in "${forbidden_matches[@]}"; do
            echo "::error title=forbidden client log pattern::$pattern"
            grep -nF -C 3 "$pattern" "$log_file" | tail -n 28 \
              | while IFS= read -r line; do echo "::error title=forbidden client log context::$line"; done
          done
          echo "::error title=client process status::exit $result"
          echo "::group::client smoke markers"
          grep -E '\[[a-z0-9-]+smoke\]|\[editor-open\]' "$log_file" | tail -n 60 || true
          last_marker=$(grep -E '\[[a-z0-9-]+smoke\]|\[editor-open\]' "$log_file" | tail -n 1)
          [ -z "$last_marker" ] || echo "::error title=last client smoke marker::$last_marker"
          echo "::endgroup::"
          echo "::group::client smoke exceptions"
          grep -nE -C 3 'PhotonFXEditorSmokeTest|IllegalStateException|NoSuchElementException|UnsupportedOperationException|MixinApplyError|InvalidInjectionException|FATAL|Caused by:' "$log_file" | tail -n 100 || true
          grep -n -A 18 -B 2 'failed to open or preview the legacy project' "$log_file" \
            | head -n 24 | while IFS= read -r line; do echo "::error title=smoke failure stack::$line"; done
          echo "::endgroup::"
          echo "Forge client smoke failed with exit status $result; see the marker and exception diagnostics above." >&2
          exit 1


