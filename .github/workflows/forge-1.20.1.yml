name: Forge 1.20.1 build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - port/forge-1.20.1-2.2.9
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Forge mod
        run: bash ./gradlew --no-daemon build

      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: photon-forge-1.20.1
          path: build/libs/*-all.jar
          if-no-files-found: error
          retention-days: 14

      - name: Smoke-test dedicated Forge server startup
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          log_file="$RUNNER_TEMP/photon-server.log"
          set +e
          timeout --signal=INT --kill-after=15s 180s bash ./gradlew --no-daemon runServer > "$log_file" 2>&1
          result=$?
          if grep -Fq 'For help, type "help"' "$log_file"; then
            echo "Forge server reached the ready state."
            exit 0
          fi
          cat "$log_file"
          echo "Forge server exited with status $result before reaching the ready state." >&2
          exit 1
