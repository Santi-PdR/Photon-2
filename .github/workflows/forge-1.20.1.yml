name: Forge 1.20.1 build

on:
  pull_request:
    branches:
      - main
      - port/forge-1.20.1-2.2.9
  push:
    branches:
      - port/forge-1.20.1-2.2.9
      - port/forge-1.20.1-sync-sound
      - arena/747b04a3-photon-2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Forge mod
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon build 2>&1 | tee "$RUNNER_TEMP/photon-build.log"

      - name: Upload failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: photon-build-diagnostics
          path: ${{ runner.temp }}/photon-build.log
          if-no-files-found: ignore

      # Artifact downloads and raw job logs are unreachable from some environments (the blob storage
      # refuses them); check-run annotations are not, so a failed compile says what broke right there.
      - name: Publish compile errors as annotations
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/photon-build.log"
          [ -f "$log" ] || exit 0
          # first the compiler's own errors, then whatever the log ended on: a failure that is not a
          # javac error (a test, a plugin) still has to be readable without the log
          grep -E '\.java:[0-9]+: error|^e: |FAILURE:|What went wrong|Execution failed|Tests? .* failed' "$log" \
            | head -n 25 | while IFS= read -r line; do echo "::error title=build::$line"; done
          echo "::group::last 25 log lines"
          tail -n 25 "$log"
          echo "::endgroup::"

      - name: Verify packaged Photon mixin config and refmap
        shell: bash
        run: |
          jar_file=$(find build/libs -maxdepth 1 -name '*-all.jar' -print -quit)
          test -n "$jar_file"
          unzip -p "$jar_file" META-INF/MANIFEST.MF | grep -Eq '^MixinConfigs: .*photon.mixins.json'
          jar tf "$jar_file" | grep -Fxq 'photon.refmap.json'
          jar tf "$jar_file" | grep -Fxq 'com/lowdragmc/photon/core/mixins/iris/IrisRenderingPipelineAccessor.class'

      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: photon-forge-1.20.1
          path: build/libs/*-all.jar
          if-no-files-found: error
          retention-days: 90

      - name: Smoke-test dedicated Forge server startup
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          log_file="$RUNNER_TEMP/photon-server.log"
          set +e
          timeout --signal=INT --kill-after=15s 180s bash ./gradlew --no-daemon runServer > "$log_file" 2>&1
          result=$?
          if grep -Fq 'For help, type "help"' "$log_file"; then
            echo "Forge server reached the ready state."
            exit 0
          fi
          grep -n -E -C 3 'ERROR|FATAL|Exception|Caused by:|fxproj|smoke|Game crashed|BUILD FAILED|Failed to (load|recompile)' "$log_file" | tail -n 240 || true
          # Surface the failure even when the Actions log archive cannot be downloaded.
          grep -E 'ERROR|FATAL|Exception|Caused by:|BUILD FAILED|What went wrong|Execution failed' "$log_file" | tail -n 25 | while IFS= read -r line; do
            echo "::error title=server startup::$line"
          done
          echo "::error title=server startup::Server exited with status $result before reaching the ready state."
          echo "Forge server exited with status $result before reaching the ready state." >&2
          exit 1

      - name: Prepare a world for the editor smoke test
        shell: bash
        run: |
          test -s run/world/level.dat
          mkdir -p run/saves
          cp -a run/world run/saves/PhotonCI
          rm -f run/saves/PhotonCI/session.lock
          mkdir -p run/ldlib2/assets
          mkdir -p run/ldlib/assets/photon_legacy_probe/textures
          mkdir -p run/photon/assets/photon_workspace_probe/textures
          printf 'legacy-pack-mounted' > run/ldlib/assets/photon_legacy_probe/textures/marker.txt
          printf 'photon-workspace-assets-mounted' > run/photon/assets/photon_workspace_probe/textures/marker.txt
          cp -a ci-fixtures/real-scan/ldlib2/assets/. run/ldlib2/assets/
          cp -a ci-fixtures/real-tornado/ldlib2/assets/. run/ldlib2/assets/
          cp -a ci-fixtures/real-shield-trail/ldlib2/assets/. run/ldlib2/assets/
          mkdir -p run/ldlib2/projects
          find run/ldlib2/assets -maxdepth 1 -name '*.fxproj' -exec mv -t run/ldlib2/projects {} +
          mkdir -p run/photon/fxpacks
          python3 - <<'PY'
          from zipfile import ZIP_DEFLATED, ZipFile
          with ZipFile("run/photon/fxpacks/server-ci-server-sync.fxpack", "w", ZIP_DEFLATED) as pack:
              pack.writestr("assets/photon_sync_probe/fx/server_sync.fx", b"server fx pack sync probe")
              pack.writestr("assets/photon_sync_probe/textures/server_sync_marker.txt", b"delivered only by the integrated server")
          PY

      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth libgl1-mesa-dri libglx-mesa0 python3-pil

      - name: Smoke-test Forge client startup without a physical display
        shell: bash
        run: |
          log_file="$RUNNER_TEMP/photon-client.log"
          set +e
          timeout --signal=INT --kill-after=15s 240s xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24 +extension GLX +render -noreset" env LIBGL_ALWAYS_SOFTWARE=1 ALSOFT_DRIVERS=null JAVA_TOOL_OPTIONS="-Dmixin.debug.verbose=true -Dphoton.fxprojSmokeTest=true -Dphoton.serverFxPackSyncSmoke=true" bash ./gradlew --no-daemon runClient > "$log_file" 2>&1
          result=$?
          required_markers=(
            'Photon shader graph nodes loaded:'
            'Sound engine started'
            'ParticleEngineAccessor'
            'photon.mixins.json'
            '[bloom-smoke] red FX halo is present while non-highlight scene pixels stay intact'
            '[fx-picker-smoke] the fx search lists every loadable effect'
            '[fx-instance-timeline-history-smoke] inspector snapshots persist FX instance timelines without crashing'
            '[bloom-control-smoke] dragging the scene bar'
            '[slider-drag-smoke] pressing and dragging the bloom slider moved it continuously'
            '[editor-open] FXEditor built in'
            '[builtin-material-picker-smoke] Kila and all built-in material presets are listed in the material selector'
            '[trail-fast-movement-smoke] high-speed trail movement is sub-sampled with a 64-point cap'
            '[trail-colour-smoke] red-to-blue trail gradient reaches both GPU/CPU point colours'
            '[fxproj-smoke] loaded synthetic .fxproj with burst'
            '[fxproj-legacy-smoke] loaded Photon 26.2 managed-list .fxproj and preserved burst fields'
            '[photon1-editor-project-smoke] opened both raw Photon 1 .fxproj layouts and preserved the originals'
            '[editor-assets-smoke] loaded Photon workspace assets and Photon 1/2 legacy assets'
            '[mixin-smoke] ParticleEngine accessor path is callable'
            '[obj-loader-compat] registered neoforge:obj using Forge'
            '[obj-model-smoke] parsed neoforge:obj through Forge and built'
            '[fxproj-editor-smoke] opened v3 managed-list project and previewed'
            '[tornado-render-smoke] loaded LDLib2 OBJ with legacy UV/brightness attributes'
            '[screen-size-smoke] custom GPU model shader rendered using framebuffer-sized ScreenSize'
            '[shader-compat-smoke] compiled two-argument fog shader and instanced variant'
            '[mesh-cache-smoke] nested load and invalidation with colliding keys succeeded'
          )
          missing_markers=()
          for marker in "${required_markers[@]}"; do
            grep -Fq "$marker" "$log_file" || missing_markers+=("$marker")
          done
          forbidden_patterns=('FATAL' 'MixinApplyError' 'InvalidInjectionException' 'ClassCastException' 'Failed to recompile shader' 'Failed to load model')
          forbidden_matches=()
          for pattern in "${forbidden_patterns[@]}"; do
            grep -Fq "$pattern" "$log_file" && forbidden_matches+=("$pattern")
          done
          if ((${#missing_markers[@]} == 0 && ${#forbidden_matches[@]} == 0)); then
            grep -E '\[.*smoke\]|\[obj-loader-compat\]' "$log_file" || true
            echo "Photon client setup and the Minecraft sound engine reached the ready state (exit $result after timeout)."
            exit 0
          fi
          for marker in "${missing_markers[@]}"; do
            echo "::error title=missing client smoke marker::$marker"
          done
          for pattern in "${forbidden_matches[@]}"; do
            echo "::error title=forbidden client log pattern::$pattern"
            grep -nF -C 3 "$pattern" "$log_file" | tail -n 28 \
              | while IFS= read -r line; do echo "::error title=forbidden client log context::$line"; done
          done
          echo "::error title=client process status::exit $result"
          echo "::group::client smoke markers"
          grep -E '\[[a-z0-9-]+smoke\]|\[editor-open\]' "$log_file" | tail -n 60 || true
          last_marker=$(grep -E '\[[a-z0-9-]+smoke\]|\[editor-open\]' "$log_file" | tail -n 1)
          [ -z "$last_marker" ] || echo "::error title=last client smoke marker::$last_marker"
          echo "::endgroup::"
          echo "::group::client smoke exceptions"
          grep -nE -C 3 'PhotonFXEditorSmokeTest|IllegalStateException|NoSuchElementException|UnsupportedOperationException|MixinApplyError|InvalidInjectionException|FATAL|Caused by:' "$log_file" | tail -n 100 || true
          grep -n -A 18 -B 2 'failed to open or preview the legacy project' "$log_file" \
            | head -n 24 | while IFS= read -r line; do echo "::error title=smoke failure stack::$line"; done
          echo "::endgroup::"
          echo "Forge client smoke failed with exit status $result; see the marker and exception diagnostics above." >&2
          exit 1


      # Keep the newly added markers visible individually as well as in the client smoke gate above.
      - name: Report the slider and editor-open markers
        if: always()
        shell: bash
        run: |
          log="$RUNNER_TEMP/photon-client.log"
          if [ ! -f "$log" ]; then
            echo "Client smoke test did not run; no markers to report."
            exit 0
          fi
          for marker in '[slider-drag-smoke]' '[editor-open] FXEditor built in' '[bloom-control-smoke]' '[loose-texture-smoke]' '[photon1-conversion-report-smoke]' '[lifetime-mode-smoke]' '[drain-exit-smoke]' '[sections-smoke]' '[release-section-smoke]' '[sections-save-smoke]' '[search-box-smoke]' '[section-command-smoke]' '[editfx-smoke]' '[editfx-root-smoke]' '[entity-follow-frame-smoke]' '[playing-bloom-smoke]' '[fx-instance-timeline-history-smoke]'; do
            if grep -Fq "$marker" "$log"; then
              echo "::notice title=marker present::$marker"
            else
              echo "::error title=marker missing::$marker"
            fi
          done

      - name: Require server FX pack download and automatic resource reload
        shell: bash
        run: grep -Fq '[server-fxpack-sync-smoke] server-only FX pack transferred in chunks and mounted after automatic resource reload' "$RUNNER_TEMP/photon-client.log"

      - name: Require exported FX over server network
        shell: bash
        run: grep -Fq '[export-server-command-smoke] server command delivered exported FX over Forge networking' "$RUNNER_TEMP/photon-client.log"

      - name: Require legacy blend and scene-masked bloom safety
        shell: bash
        run: |
          grep -Fq '[legacy-blend-smoke] legacy equations converted without mutation and invalid blend fields are safe' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[bloom-scene-mask-smoke] bright sky mismatch stays dim while FX contribution survives' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[photon1-old-trail-smoke] migrated legacy constant widths exactly once and preserved curve output' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[photon1-raw-shape-smoke] restored pre-NumberFunction3 shape transforms through save and reload' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[photon1-flat-trail-smoke] restored flat trail material, parameters and nested override' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[photon1-codec-smoke] loaded Photon 1 type names without reconverting' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[photon1-port-holes-smoke] PascalCase types, unknown parents and lowercase startSize convert' "$RUNNER_TEMP/photon-client.log"

      - name: Require visible bloom from ordinary FX colors
        shell: bash
        run: grep -Fq '[bloom-smoke] red FX halo is present while non-highlight scene pixels stay intact' "$RUNNER_TEMP/photon-client.log"

      - name: Require built-in Photon material presets in the editor picker
        shell: bash
        run: grep -Fq '[builtin-material-picker-smoke] Kila and all built-in material presets are listed in the material selector' "$RUNNER_TEMP/photon-client.log"

      - name: Require smooth high-speed trails and trail gradients
        shell: bash
        run: |
          grep -Fq '[trail-fast-movement-smoke] high-speed trail movement is sub-sampled with a 64-point cap' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[trail-colour-smoke] red-to-blue trail gradient reaches both GPU/CPU point colours' "$RUNNER_TEMP/photon-client.log"

      - name: Require the 26.3 lifetime and exit modes
        shell: bash
        run: |
          grep -Fq '[lifetime-mode-smoke] Once holds at 1, Loop wraps to the same phase and PingPong returns' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[drain-exit-smoke] a draining clip survives saving and an older project still reads as Cut' "$RUNNER_TEMP/photon-client.log"

      - name: Require the section command
        shell: bash
        run: grep -Fq '[section-command-smoke] /photon fx section is registered and a jump command moves a playing timeline into the named section' "$RUNNER_TEMP/photon-client.log"

      - name: Require the editfx command
        shell: bash
        run: grep -Fq '[editfx-smoke] /photon fx editfx is registered and saving replaces the playable .fx' "$RUNNER_TEMP/photon-client.log"

      - name: Require editor root transforms to save
        shell: bash
        run: grep -Fq '[editfx-root-smoke] editor root move/scale is baked into children on save' "$RUNNER_TEMP/photon-client.log"

      - name: Require entity FX to follow before particles draw
        shell: bash
        run: grep -Fq '[entity-follow-frame-smoke] entity FX follow before particles is registered' "$RUNNER_TEMP/photon-client.log"

      - name: Require in-world FX to contribute bloom
        shell: bash
        run: grep -Fq '[playing-bloom-smoke] in-world FX contribute their authored bloom intensity' "$RUNNER_TEMP/photon-client.log"

      - name: Require search pickers to open on the whole catalogue
        shell: bash
        run: grep -Fq '[search-box-smoke] opening a picker with a value already chosen lists the whole catalogue' "$RUNNER_TEMP/photon-client.log"

      - name: Require the 26.3 inspector marks and disabled menu leaves
        shell: bash
        run: |
          grep -Fq '[inspector-marks-smoke] persisted keys and the 2.2.46.a configurator mixin are in place' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[disabled-leaf-smoke] unavailable menu actions stay visible and cannot be picked' "$RUNNER_TEMP/photon-client.log"

      - name: Require the FXPack manager to remember its window size
        shell: bash
        run: grep -Fq '[fxpack-dialog-size-smoke] pack contents dialog size is remembered' "$RUNNER_TEMP/photon-client.log"

      - name: Require Photon 1 entity FX to stay on the torso
        shell: bash
        run: grep -Fq '[photon1-feet-smoke] converted FX follow the feet; Photon 2 FX follow the eyes' "$RUNNER_TEMP/photon-client.log"

      - name: Require Photon 1 bloom to survive conversion
        shell: bash
        run: grep -Fq '[photon1-bloom-smoke] converted FX keep Photon 1 bloom' "$RUNNER_TEMP/photon-client.log"

      - name: Require the editor to list loaded textures
        shell: bash
        run: grep -Fq '[loaded-texture-catalogue-smoke] editor can pick' "$RUNNER_TEMP/photon-client.log"

      - name: Require the 26.3 timeline sections
        shell: bash
        run: |
          grep -Fq '[sections-smoke] a section repeating 3 times plays 30 ticks and then starts the next one' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[release-section-smoke] stopping enters the release section and it plays once, not forever' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[sections-save-smoke] sections and the release section survive saving' "$RUNNER_TEMP/photon-client.log"

      - name: Require Photon 1 effect conversion
        shell: bash
        run: |
          grep -Fq '[photon1-conversion-smoke] legacy effects, bursts and enabled modules converted' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[photon1-conversion-report-smoke] a second pass reported' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[loose-texture-smoke] found cursedfate_probe:textures/particle/loose_probe.png' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[loose-texture-smoke] found cursedfate_stray:textures/particle/stray_probe.png' "$RUNNER_TEMP/photon-client.log"

      - name: Require Photon 1 editor project import
        shell: bash
        run: grep -Fq '[photon1-editor-project-smoke] opened both raw Photon 1 .fxproj layouts and preserved the originals' "$RUNNER_TEMP/photon-client.log"

      - name: Require opening an FX not to write a project
        shell: bash
        run: |
          grep -Fq '[fx-open-no-write-smoke] opening an .fx does not write a project' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[fx-project-recover-smoke] a project saved over an .fx still loads' "$RUNNER_TEMP/photon-client.log"

      - name: Require FX pack dependency retention
        shell: bash
        run: grep -Fq '[fxpack-dependency-smoke] model, texture metadata and glTF buffers survive pack cleanup' "$RUNNER_TEMP/photon-client.log"

      - name: Require self-contained shield FX pack
        shell: bash
        run: grep -Fq '[shield-fxpack-smoke] packed shield material, shader, JSON model and OBJ' "$RUNNER_TEMP/photon-client.log"

      - name: Require late scene sampler to include prior effects
        shell: bash
        run: grep -Fq '[late-scene-composite-smoke] scene sampling includes previously drawn FX' "$RUNNER_TEMP/photon-client.log"

      - name: Require scan rendering in first person
        shell: bash
        run: |
          grep -Fq '[first-person-scan-cpu-smoke] owner billboard rendered' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[first-person-scan-gpu-smoke] owner billboard rendered' "$RUNNER_TEMP/photon-client.log"

      - name: Require Forge particle culling compatibility
        shell: bash
        run: grep -Fq '[forge-cull-smoke] disabled culling stays visible and authored bounds reach Forge' "$RUNNER_TEMP/photon-client.log"

      - name: Require queued particle removal
        shell: bash
        run: grep -Fq '[queued-removal-smoke] forced removal cleared pending particles' "$RUNNER_TEMP/photon-client.log"

      - name: Require entity effect removal
        shell: bash
        run: grep -Fq '[remove-server-command-smoke] default remove cleared long-lived entity particles' "$RUNNER_TEMP/photon-client.log"

      - name: Require editor render state restoration
        shell: bash
        run: grep -Fq '[editor-state-smoke] restored scissor and shader time after rendering' "$RUNNER_TEMP/photon-client.log"

      - name: Require legacy viewport and tornado channel restoration
        shell: bash
        run: |
          grep -Fq '[legacy-viewport-projection-smoke] reconstructed viewport center and preserved custom shader' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[particle-light-fallback-smoke] preserved valid light and restored uninitialized fullbright' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[trail-interpolation-smoke] guarded invalid durations and equal tail lifetimes' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[burst-interval-smoke] clamped invalid interval and emitted three bursts' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[culled-cpu-billboard-smoke] camera-facing billboard changed' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[culled-gpu-billboard-smoke] camera-facing billboard changed' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[real-scan-project-smoke] opened original scan project in editor' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[real-scan-shader-smoke] original scan shader compiled and particle is alive' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[real-scan-pixels-smoke] original scan project changed' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[real-tornado-project-smoke] loaded four live OBJ model emitters and their original shaders' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[real-tornado-sparks-smoke] original spark emitter has' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[real-tornado-pixels-smoke] original tornado shader changed' "$RUNNER_TEMP/photon-client.log"
          for layer in tornado_body tornado_body2 tornado_cap tornado_body3; do
            grep -Fq "[real-tornado-layer-smoke] $layer contributed pixels: true" "$RUNNER_TEMP/photon-client.log"
          done
          grep -Fq '[real-shield-project-smoke] loaded original shield model and shader' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[export-entity-smoke] exported definition loaded and started on player through decoded packet' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[real-shield-pixels-smoke] original shield shader changed' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[real-arrow-trail-project-smoke] original trail accumulated moving segments' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[real-arrow-trail-pixels-smoke] original moving trail changed' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[legacy-gpu-channel-smoke] restored tornado particle T attribute from legacy NBT' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[legacy-tornado-depth-smoke] restored authored depth and culling state' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[legacy-tornado-curve-smoke] restored and uploaded a multi-segment dissolve curve' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[legacy-scan-depth-smoke] restored disabled scan depth settings' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[legacy-shield-state-smoke] restored two-sided shield depth settings' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[shield-two-sided-smoke] front and back faces contributed' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[render-pass-order-smoke] preserved colliding render passes and extreme layers' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[legacy-obj-quad-smoke] preserved original OBJ quad diagonal' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[legacy-obj-json-smoke] preserved centered model position and flipped V' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[obj-sampling-topology-smoke] preserved eight render vertices and four sampling vertices' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[model-pivot-smoke] custom model shader received nonzero runtime pivot' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[gpu-model-sorting-smoke] drew' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[particle-blend-factors-smoke] preserved authored alpha blend factors after shader apply' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[gpu-model-sorting-pixels-smoke] sorted GPU models changed' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[scene-color-copy-smoke] copied' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[scene-depth-copy-smoke] copied' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[scene-color-binding-smoke] custom shader sampled the current scene color texture' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[scene-depth-binding-smoke] custom shader sampled the current scene depth texture' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[dynamic-empty-draw-smoke] no provider callback for an empty model queue' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[legacy-billboard-uv-smoke] restored the default camera-facing UV flip' "$RUNNER_TEMP/photon-client.log"

      - name: Require a moving GPU trail smoke result
        shell: bash
        run: grep -Fq '[trail-render-smoke] custom TRAIL_INSTANCE shader rendered moving GPU trail' "$RUNNER_TEMP/photon-client.log"

      - name: Require a moving AraTrail smoke result
        shell: bash
        run: |
          grep -Fq '[ara-trail-points-smoke] moving AraTrail accumulated' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[ara-trail-mesh-smoke] generated' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[ara-trail-pixels-smoke] AraTrail changed' "$RUNNER_TEMP/photon-client.log"

      - name: Require legacy variant uniform restoration
        shell: bash
        run: grep -Fq '[legacy-variant-uniform-smoke] restored variant-only uniform from legacy shader data with samplers' "$RUNNER_TEMP/photon-client.log"

      - name: Require a textured CPU trail to draw
        shell: bash
        run: grep -Fq '[cpu-trail-render-smoke] textured CPU trail changed' "$RUNNER_TEMP/photon-client.log"

      - name: Require legacy HDR values to survive editing and reload
        shell: bash
        run: grep -Fq '[legacy-hdr-smoke] preserved legacy HDR values through editing and material reload' "$RUNNER_TEMP/photon-client.log"

      - name: Require the original tangent shader inputs
        shell: bash
        run: grep -Fq '[tangent-abi-smoke] compiled original vec2 UV and vec4 normal tangent inputs' "$RUNNER_TEMP/photon-client.log"

      - name: Require the external legacy trail material
        shell: bash
        run: grep -Fq '[external-trail-material-smoke] loaded the legacy file-backed trail material' "$RUNNER_TEMP/photon-client.log"

      - name: Require the legacy trail width curve
        shell: bash
        run: grep -Fq '[legacy-trail-curve-smoke] restored a nonzero width from the legacy curve' "$RUNNER_TEMP/photon-client.log"

      - name: Verify the editor actually displays the particle
        shell: bash
        run: |
          /usr/bin/python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          from PIL import Image, ImageChops
          log = Path(os.environ['RUNNER_TEMP'], 'photon-client.log').read_text(errors='replace')
          def screenshot(marker):
              match = re.search(re.escape(marker) + r'.*?Saved screenshot as ([^\s]+\.png)', log)
              if not match:
                  raise SystemExit(f'Missing editor screenshot marker: {marker}')
              return Path('run/screenshots') / match.group(1)
          images = [screenshot('[fxproj-editor-smoke] screenshot:'),
                    screenshot('[fxproj-editor-smoke] expired screenshot:')]
          active, expired = [Image.open(path).convert('RGB').crop((300, 180, 1010, 550)) for path in images]
          changed = sum(1 for pixel in ImageChops.difference(active, expired).getdata() if pixel != (0, 0, 0))
          print(f'Editor scene pixels changed by the live particle: {changed}')
          if changed < 10:
              raise SystemExit('Particle was alive but did not visibly change the editor scene')
          PY

      # the same reason as the build's: the client log is where a failed smoke test says why, and the
      # artifact holding it may be unreachable, so its smoke lines and its exception are annotated too
      - name: Publish client smoke failures as annotations
        if: failure()
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/photon-client.log"
          [ -f "$log" ] || exit 0
          echo "::group::smoke markers"
          grep -E '\[[a-z0-9-]+smoke\]' "$log" | tail -n 40 || true
          echo "::endgroup::"
          echo "::group::last 60 lines"
          tail -n 60 "$log"
          echo "::endgroup::"
          echo "::group::noise filter"
          echo "The headless client always logs a narrator and a netty failure; neither stops the run."
          echo "::endgroup::"
          # Our own assertion first: the log's first Exception is narrator/netty noise, and publishing that
          # instead of the smoke failure is why a red run used to say nothing about what broke.
          grep -oE 'IllegalStateException: .{0,300}' "$log" | grep -vE 'flite|Narrator' | head -n 4 | \
            while IFS= read -r line; do echo "::error title=smoke assertion::$line"; done
          # Then one flattened window: the 25 lines of our own logging before the first line that names the
          # test, which is where the reason for the failure always is.
          hit=$(grep -nE 'PhotonFXEditorSmokeTest|IllegalStateException' "$log" | head -n 1 | cut -d: -f1)
          if [ -n "$hit" ]; then
            from=$(( hit > 25 ? hit - 25 : 1 ))
            sed -n "${from},$(( hit + 4 ))p" "$log" | tr '\n' '|' | head -c 2500 | \
              while IFS= read -r line; do echo "::error title=log window::$line"; done
          fi
          # Finally the generic sweep, filtered, as a last resort. Include the owning Java frames for
          # Optional failures and blocked reflection, not only the exception headline.
          grep -n -A 12 -B 1 -E 'NoSuchElementException|UnsupportedOperationException' "$log" \
            | head -n 28 | while IFS= read -r line; do echo "::error title=client exception trace::$line"; done
          grep -E 'Exception|Caused by:|FATAL|error:' "$log" | grep -vE 'flite|Narrator|netty|Unsafe|Native library' \
            | head -n 6 | while IFS= read -r line; do echo "::error title=client::$line"; done

      - name: Upload client smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-client-diagnostics
          path: |
            ${{ runner.temp }}/photon-client.log
            run/logs/*.log
            run/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14


      # Actions artifacts are ZIP downloads. Attach the JAR after the Forge mod compiled on this
      # session branch, even if the headless client smoke fails (that job has been red independently
      # of the compile). A missing jar still fails this step.
      - name: Publish direct-download preview JAR
        if: >-
          always() && !cancelled() &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/arena/747b04a3-photon-2') ||
           (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.head.ref == 'arena/747b04a3-photon-2'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*-all.jar' -print)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one distributable JAR, found ${#jars[@]}" >&2
            exit 1
          fi
          tag="preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "${jars[0]}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Photon Forge 1.20.1 preview ${GITHUB_SHA:0:7}" \
            --notes "Test build from commit $GITHUB_SHA. Download the .jar asset and place it in the Minecraft instance's mods folder. This is a preview, not a stable release."
          printf '### Direct JAR download\n\n[Download %s](https://github.com/%s/releases/download/%s/%s)\n' \
            "$(basename "${jars[0]}")" "$GITHUB_REPOSITORY" "$tag" "$(basename "${jars[0]}")" >> "$GITHUB_STEP_SUMMARY"
