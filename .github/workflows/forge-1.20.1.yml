        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/photon-client.log"
          [ -f "$log" ] || exit 0
          echo "::group::smoke markers"
          grep -E '\[[a-z0-9-]+smoke\]' "$log" | tail -n 40 || true
          echo "::endgroup::"
          echo "::group::last 60 lines"
          tail -n 60 "$log"
          echo "::endgroup::"
          echo "::group::noise filter"
          echo "The headless client always logs a narrator and a netty failure; neither stops the run."
          echo "Blocked Mojang session servers make authlib fail over a Gson parse of the HTML error page"
          echo "('Expected BEGIN_OBJECT but was STRING'); that noise is external and must never gate or mask a run."
          echo "::endgroup::"
          # Our own assertion first: the log's first Exception is narrator/netty noise, and publishing that
          # instead of the smoke failure is why a red run used to say nothing about what broke.
          grep -oE 'IllegalStateException: .{0,300}' "$log" | grep -vE 'flite|Narrator|Expected BEGIN_OBJECT' | head -n 4 | \
            while IFS= read -r line; do echo "::error title=smoke assertion::$line"; done
          # Then one flattened window: the 25 lines of our own logging before the first line that names the
          # test, which is where the reason for the failure always is.
          hit=$(grep -nE 'PhotonFXEditorSmokeTest|IllegalStateException' "$log" | head -n 1 | cut -d: -f1)
          if [ -n "$hit" ]; then
            from=$(( hit > 25 ? hit - 25 : 1 ))
            sed -n "${from},$(( hit + 4 ))p" "$log" | tr '\n' '|' | head -c 2500 | \
              while IFS= read -r line; do echo "::error title=log window::$line"; done
          fi
          # Finally the generic sweep, filtered, as a last resort. Include the owning Java frames for
          # Optional failures and blocked reflection, not only the exception headline.
          grep -n -A 12 -B 1 -E 'NoSuchElementException|UnsupportedOperationException' "$log" \
            | grep -vE 'Reflective setAccessible|PlatformDependent|netty' \
            | head -n 28 | while IFS= read -r line; do echo "::error title=client exception trace::$line"; done
          grep -E 'Exception|Caused by:|FATAL|error:' "$log" \
            | grep -vE 'flite|Narrator|netty|Unsafe|Native library|authlib|AuthenticationUnavailable|MinecraftClientException|Expected BEGIN_OBJECT' \
            | head -n 6 | while IFS= read -r line; do echo "::error title=client::$line"; done

      - name: Upload client smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-client-diagnostics
          path: |
            ${{ runner.temp }}/photon-client.log
            run/logs/*.log
            run/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14

  publish-preview:
    needs: build
    if: >-
      always() && !cancelled() && needs.build.outputs.distributable_uploaded == 'true' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')) ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'arena/')))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download distributable
        uses: actions/download-artifact@v4
        with:
          name: photon-forge-1.20.1
          path: build/libs

      - name: Publish direct-download preview JAR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*-all.jar' -print)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one distributable JAR, found ${#jars[@]}" >&2
            exit 1
          fi
          tag="preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # On pull_request runs GITHUB_SHA is the synthetic merge commit, which GitHub rebuilds on the
          # next push to the branch; a release targeting the superseded one is refused (HTTP 403,
          # "Resource not accessible by integration"). Target the branch commit instead.
          target="${PR_HEAD_SHA:-$GITHUB_SHA}"
          gh release create "$tag" "${jars[0]}" \
            --repo "$GITHUB_REPOSITORY" --target "$target" --prerelease \
            --title "Photon Forge 1.20.1 preview ${target:0:7}" \
            --notes "Test build from commit $target. Download the .jar asset and place it in the Minecraft instance's mods folder. This is a preview, not a stable release."
          printf '### Direct JAR download\n\n[Download %s](https://github.com/%s/releases/download/%s/%s)\n' \
            "$(basename "${jars[0]}")" "$GITHUB_REPOSITORY" "$tag" "$(basename "${jars[0]}")" >> "$GITHUB_STEP_SUMMARY"
