      - name: Generate audio conversion smoke fixtures
        run: |
          mkdir -p run/photon/smoke-fixtures
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=0.5" -ac 2 -c:a libmp3lame -b:a 128k run/photon/smoke-fixtures/beat.mp3
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=0.5" -ac 2 -c:a aac -b:a 128k run/photon/smoke-fixtures/beat.m4a
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=0.5" -ac 2 -ar 48000 run/photon/smoke-fixtures/beat48k.wav
          ffmpeg -loglevel error -f lavfi -i "testsrc=size=64x64:duration=0.5" -f lavfi -i "sine=frequency=440:duration=0.5" -ac 2 -c:v libx264 -c:a aac -shortest run/photon/smoke-fixtures/beat.mp4

      # The dev-run smoke tests below exercise the original codec libraries from the Gradle classpath;
      # only the packaged jar carries the copies shadowJar relocated under
      # com.lowdragmc.photon.internal.embedded. Decode and encode with those, compiled against the
      # distributable alone and with the jar as a named module, so a relocation that lost a class, a
      # resource or a reference fails here.
      - name: Exercise the relocated audio codecs from the distributable
        shell: bash
        run: |
          jar_file=$(find build/libs -maxdepth 1 -name '*-all.jar' -print -quit)
          test -n "$jar_file"
          work="$RUNNER_TEMP/relocated-codecs"
          rm -rf "$work"
          mkdir -p "$work/classes"
          cp run/photon/smoke-fixtures/beat.mp3 run/photon/smoke-fixtures/beat.m4a "$work/"
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=0.5" -ac 2 -c:a aac -b:a 128k -f adts "$work/beat.aac"
          javac -d "$work/classes" -cp "$jar_file" .github/scripts/RelocatedCodecsCheck.java
          # The jar goes on the module path (an automatic module, as the loader makes a named module of
          # it in the game) so that the codecs' resource lookups run under module encapsulation too.
          if ! java -p "$jar_file" --add-modules ALL-MODULE-PATH -cp "$work/classes" RelocatedCodecsCheck "$work" > "$work/check.log" 2>&1; then
            cat "$work/check.log"
            # the whole trace as annotations: the step log is not always reachable from where this is read
            grep -E 'STAGE FAILED|Exception|Error|^\s+at (com\.lowdragmc|RelocatedCodecsCheck)' "$work/check.log" > "$work/trace.txt" || true
            head -n 24 "$work/trace.txt" | while IFS= read -r line; do
              echo "::error title=relocated codecs::$line"
            done
            echo "::error title=relocated codecs::the relocated jLayer/JAAD/jVorbisEnc inside the distributable failed"
            exit 1
          fi
          cat "$work/check.log"
          # What the relocated encoder wrote must be Ogg Vorbis to an independent decoder as well
          # (mono: AudioConverter always downmixes before encoding, and so does the check).
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -of default=nw=1 "$work/relocated.ogg" > "$work/probe.txt"
          cat "$work/probe.txt"
          grep -Fxq 'codec_name=vorbis' "$work/probe.txt"
          grep -Fxq 'sample_rate=44100' "$work/probe.txt"
          grep -Fxq 'channels=1' "$work/probe.txt"
          ffmpeg -v error -xerror -i "$work/relocated.ogg" -f null -
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$work/relocated.ogg")
          python3 -c 'import sys; d = float(sys.argv[1]); assert 0.3 <= d <= 0.9, "relocated.ogg lasts %s s" % d' "$duration"
          echo "::notice title=relocated codecs::$(tail -n 1 "$work/check.log")"

      - name: Smoke-test Forge client startup without a physical display
        shell: bash
        run: |
          log_file="$RUNNER_TEMP/photon-client.log"
          set +e
          timeout --signal=INT --kill-after=15s 240s xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24 +extension GLX +render -noreset" env LIBGL_ALWAYS_SOFTWARE=1 ALSOFT_DRIVERS=null JAVA_TOOL_OPTIONS="-Dmixin.debug.verbose=true -Dphoton.fxprojSmokeTest=true -Dphoton.serverFxPackSyncSmoke=true" bash ./gradlew --no-daemon runClient > "$log_file" 2>&1
          result=$?
          # Some crashes dump binary bytes into stdout and grep then hides every diagnostic as
          # "binary file matches". Strip NULs so all later greps treat the log as text.
          tr -d '\000' < "$log_file" > "$log_file.clean" && mv "$log_file.clean" "$log_file"
          required_markers=(
            'Photon shader graph nodes loaded:'
            'Sound engine started'
            'ParticleEngineAccessor'
            'photon.mixins.json'
            '[bloom-smoke] red FX halo is present while non-highlight scene pixels stay intact'
            '[bloom-mip-fit-smoke] the bloom pyramid is clamped to the frame (1080p holds 9 levels, 2x2 none)'
            '[fx-picker-smoke] the fx search lists every loadable effect'
            '[fx-instance-timeline-history-smoke] inspector snapshots persist FX instance timelines without crashing'
            '[bloom-control-smoke] dragging the scene bar'
            '[slider-drag-smoke] pressing and dragging the bloom slider moved it continuously'
            '[editor-open] FXEditor built in'
            '[material-reference-cycle-smoke] resource material chains resolve and cycles fall back safely'
            '[material-persistence-smoke] created materials persist on disk and travel inside the project file'
            '[fxpack-stall-watchdog-smoke] stalled server pack transfers are swept and live ones survive'
            '[fxpack-watcher-smoke] copied, same-size replaced and removed packs each owe one reload once they stop changing, kept until a reload covers it'
            '[fxpack-watcher-mount-smoke] a pack copied into photon/fxpacks was mounted by the folder watcher without F3+T'
            '[upload-archive-smoke] the local LDLib2 asset archive skips unsafe names and passes pack validation'
            '[late-replay-smoke] entity and block FX snapshots replay with their fields and per-chunk filtering'
            '[audio-conversion-smoke] user audio formats convert to playable mono Ogg Vorbis'
            '[sound-length-smoke] an imported sound reports its measured length once asked to wait for it instead of 0 on the first ask'
            '[dialog-size-close-smoke] a window-mode dialog stores the size it had on screen when it closes, and a damaged 0x0 entry reads as no entry'
            '[kotlin-runtime-isolation-smoke] LDLib2'"'"'s Kotlin classes link only against the relocated runtime under com.lowdragmc.photon.internal.embedded and it loads'
            '[virtual-level-tick-smoke] LDLib2 virtual levels post no Forge LevelTickEvent while a listener casts event.level to ClientLevel'
            '[missing-effect-smoke] an effect id no pack provides is read and logged once, answered from memory afterwards and forgotten by a reload'
            '[fxpack-local-twin-smoke] a pack the server offers that is already installed in photon/fxpacks is used in place, not downloaded as a server-<hash> copy'
            '[server-fxpack-watcher-smoke] a pack replaced, added or removed on the server is offered to the players online once it holds still, kept through the offer quota and never for a change that undid itself'
            '[fxpack-server-update-smoke] a pack replaced in the server'"'"'s photon/fxpacks reached a playing client by itself: new version downloaded and mounted, old copy unmounted and removed, no command, reinstall or F3+T'
            '[fxpack-hot-mount-smoke] server packs at login and on update, and a pack copied into photon/fxpacks, were mounted and unmounted in the running resource manager with no resource reload; the new pack'"'"'s sounds.json events were registered and the old pack'"'"'s taken out'
            '[gpu-compat-smoke] vendor='
            '[freeze-watchdog-smoke] armed'
            '[gpu-compat-regression-smoke] AMD/Intel Windows drivers get the conservative profile, uploads restore the texture state, pass errors are counted and the freeze report is complete'
            '[mixin-audit-smoke] configs='
            '[mixin-audit-regression-smoke] a bundled Photon 1 is called out, the render-path line names every config on a class and the live audit sees Photon'"'"'s own hooks'
            '[kila-texture-assets-smoke] all '
            '[kila-material-sanitize-smoke] corrupt driver and texture enum values fall back safely'
            '[kila-preset-resources-smoke] '
            '[kila-preset-shaders-smoke] all '
            '[kila-flipbook-sheets-smoke] '
            '[kila-preset-serialization-smoke] all '
            '[builtin-material-picker-smoke] Kila and all built-in material presets are listed in the material selector'
            '[trail-fast-movement-smoke] high-speed trail movement is sub-sampled with a 64-point cap'
            '[trail-colour-smoke] red-to-blue trail gradient reaches both GPU/CPU point colours'
            '[fxproj-smoke] loaded synthetic .fxproj with burst'
            '[fxproj-legacy-smoke] loaded Photon 26.2 managed-list .fxproj and preserved burst fields'
            '[photon1-editor-project-smoke] opened both raw Photon 1 .fxproj layouts and preserved the originals'
            '[editor-assets-smoke] loaded Photon workspace assets and Photon 1/2 legacy assets'
            '[mixin-smoke] ParticleEngine accessor path is callable'
            '[obj-loader-compat] registered neoforge:obj using Forge'
            '[obj-model-smoke] parsed neoforge:obj through Forge and built'
            '[loose-ldlib2-obj-smoke] adopted dropped OBJ, its MTL, and '
            '[fxproj-editor-smoke] opened v3 managed-list project and previewed'
            '[tornado-render-smoke] loaded LDLib2 OBJ with legacy UV/brightness attributes'
            '[screen-size-smoke] custom GPU model shader rendered using framebuffer-sized ScreenSize'
            '[shader-compat-smoke] compiled two-argument fog shader and instanced variant'
            '[mesh-cache-smoke] nested load and invalidation with colliding keys succeeded'
          )
          missing_markers=()
          for marker in "${required_markers[@]}"; do
            grep -Fq "$marker" "$log_file" || missing_markers+=("$marker")
          done
          forbidden_patterns=('FATAL' 'MixinApplyError' 'InvalidInjectionException' 'ClassCastException' 'Failed to recompile shader' 'Failed to load model')
          forbidden_matches=()
          for pattern in "${forbidden_patterns[@]}"; do
            grep -Fq "$pattern" "$log_file" && forbidden_matches+=("$pattern")
          done
          if ((${#missing_markers[@]} == 0 && ${#forbidden_matches[@]} == 0)); then
            grep -E '\[.*smoke\]|\[obj-loader-compat\]' "$log_file" || true
            echo "Photon client setup and the Minecraft sound engine reached the ready state (exit $result after timeout)."
            exit 0
          fi
          for marker in "${missing_markers[@]}"; do
            echo "::error title=missing client smoke marker::$marker"
          done
          for pattern in "${forbidden_matches[@]}"; do
            echo "::error title=forbidden client log pattern::$pattern"
            grep -nF -C 3 "$pattern" "$log_file" | tail -n 28 \
              | while IFS= read -r line; do echo "::error title=forbidden client log context::$line"; done
          done
          echo "::error title=client process status::exit $result"
          echo "::group::client smoke markers"
          grep -E '\[[a-z0-9-]+smoke\]|\[editor-open\]' "$log_file" | tail -n 60 || true
          last_marker=$(grep -E '\[[a-z0-9-]+smoke\]|\[editor-open\]' "$log_file" | tail -n 1)
          [ -z "$last_marker" ] || echo "::error title=last client smoke marker::$last_marker"
          echo "::endgroup::"
          echo "::group::client smoke exceptions"
          grep -nE -C 3 'PhotonFXEditorSmokeTest|IllegalStateException|NoSuchElementException|UnsupportedOperationException|MixinApplyError|InvalidInjectionException|FATAL|Caused by:' "$log_file" | tail -n 100 || true
          grep -n -A 18 -B 2 'failed to open or preview the legacy project' "$log_file" \
            | head -n 24 | while IFS= read -r line; do echo "::error title=smoke failure stack::$line"; done
          echo "::endgroup::"
          echo "Forge client smoke failed with exit status $result; see the marker and exception diagnostics above." >&2
          exit 1


      # Keep the newly added markers visible individually as well as in the client smoke gate above.
      - name: Report the slider and editor-open markers
        if: always()
        shell: bash
        run: |
          log="$RUNNER_TEMP/photon-client.log"
          if [ ! -f "$log" ]; then
            echo "Client smoke test did not run; no markers to report."
            exit 0
          fi
          for marker in '[slider-drag-smoke]' '[editor-open] FXEditor built in' '[bloom-control-smoke]' '[loose-texture-smoke]' '[photon1-conversion-report-smoke]' '[lifetime-mode-smoke]' '[kila-material-sanitize-smoke]' '[drain-exit-smoke]' '[sections-smoke]' '[sections-sanitize-smoke]' '[release-section-smoke]' '[sections-save-smoke]' '[search-box-smoke]' '[section-command-smoke]' '[editfx-smoke]' '[editfx-path-smoke]' '[loose-texture-path-smoke]' '[playback-rate-sanitize-smoke]' '[blend-preset-classification-smoke]' '[fxpack-stream-validation-smoke]' '[editfx-root-smoke]' '[entity-follow-frame-smoke]' '[playing-bloom-smoke]' '[fx-instance-timeline-history-smoke]' '[animated-property-load-smoke]' '[timeline-insert-time-smoke]' '[asset-pick-rejection-smoke]' '[expression-safety-smoke]' '[sub-emitter-cycle-smoke]' '[trail-smooth-bound-smoke]' '[aratrail-warmup-bound-smoke]' '[prewarm-bound-smoke]' '[curve-bound-finite-smoke]' '[beam-layer-queue-smoke]' '[aratrail-inherit-duration-smoke]' '[audio-source-release-smoke]' '[audio-3d-remove-smoke]' '[export-all-fxpack-smoke]' '[fxpack-watcher-smoke]' '[fxpack-watcher-mount-smoke]' '[sound-length-smoke]' '[dialog-size-close-smoke]' '[kotlin-runtime-isolation-smoke]' '[virtual-level-tick-smoke]' '[virtual-level-tick]' '[missing-effect-smoke]' '[fxpack-local-twin-smoke]' '[server-fxpack-watcher-smoke]' '[fxpack-server-update-smoke]' '[fxpack-hot-mount-smoke]' '[gpu-compat-smoke]' '[freeze-watchdog-smoke]' '[gpu-compat-regression-smoke]' '[mixin-audit-smoke]' '[mixin-audit-regression-smoke]' '[bloom-mip-fit-smoke]'; do
            if grep -Fq "$marker" "$log"; then
              echo "::notice title=marker present::$marker"
            else
              echo "::error title=marker missing::$marker"
            fi
          done

      # Non-failing audit aid: the distinct WARN/ERROR lines that mention Photon, LDLib or Kila in
      # both smoke logs (prefix stripped, numbers normalised, known authlib noise removed), printed
      # here and published as one notice annotation per log so an audit can read them through the
      # check-run API without downloading the log archive.
      - name: Summarize Photon warnings from the smoke logs
        if: always()
        shell: bash
        run: |
          for which in client server; do
            log="$RUNNER_TEMP/photon-$which.log"
            if [ ! -f "$log" ]; then
              echo "== $which: no log"
              continue
            fi
            relevant=$(grep -aE '/(WARN|ERROR)\]' "$log" \
              | grep -aEi 'photon|ldlib|kila' \
              | grep -avE 'authlib|Expected BEGIN_OBJECT|AuthenticationUnavailable' || true)
            # vanilla ShaderInstance warns for every uniform/sampler a shader JSON declares but the GLSL
            # never reads (the linker drops it); harmless, and numerous enough to crowd out the real lines
            unused_uniforms=$(printf '%s\n' "$relevant" | grep -acE 'could not find (uniform|sampler) named' || true)
            summary=$(printf '%s\n' "$relevant" \
              | grep -avE 'could not find (uniform|sampler) named' \
              | sed -E 's/^\[[^]]*\] \[[^]]*\]:? ?//; s/\b[0-9]+(\.[0-9]+)?\b/N/g' \
              | sort | uniq -c | sort -rn | head -n 40 | cut -c1-200 || true)
            count=$(printf '%s\n' "$summary" | grep -c . || true)
            echo "== $which: $count distinct Photon WARN/ERROR lines ($unused_uniforms declared-but-unused uniform warnings left out)"
            printf '%s\n' "$summary"
            if [ "$count" -gt 0 ]; then
              encoded=$(printf '%s' "$summary" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-3900)
              echo "::notice title=photon $which WARN/ERROR summary ($count distinct, $unused_uniforms unused-uniform lines left out)::$encoded"
            else
              echo "::notice title=photon $which WARN/ERROR summary::none ($unused_uniforms unused-uniform lines left out)"
            fi
          done

      # Round 24: the pack a server sends is mounted in the running resource manager — no reload, no loading screen,
      # no sound engine restart — and its sounds.json still reaches the sound manager.
      - name: Require server FX pack download and in-place mount without a resource reload
        shell: bash
        run: grep -Fq '[server-fxpack-sync-smoke] server-only FX pack transferred in chunks and mounted in the running resource manager, sounds included, without a resource reload' "$RUNNER_TEMP/photon-client.log"

      - name: Require exported FX over server network
        shell: bash
        run: grep -Fq '[export-server-command-smoke] server command delivered exported FX over Forge networking' "$RUNNER_TEMP/photon-client.log"

      - name: Require legacy blend and scene-masked bloom safety
        shell: bash
        run: |
          grep -Fq '[legacy-blend-smoke] legacy equations converted without mutation and invalid blend fields are safe' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[bloom-scene-mask-smoke] bright sky mismatch stays dim while FX contribution survives' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[photon1-old-trail-smoke] migrated legacy constant widths exactly once and preserved curve output' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[photon1-raw-shape-smoke] restored pre-NumberFunction3 shape transforms through save and reload' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[photon1-flat-trail-smoke] restored flat trail material, parameters and nested override' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[photon1-codec-smoke] loaded Photon 1 type names without reconverting' "$RUNNER_TEMP/photon-client.log"
          grep -Fq '[photon1-port-holes-smoke] PascalCase types, unknown parents and lowercase startSize convert' "$RUNNER_TEMP/photon-client.log"

