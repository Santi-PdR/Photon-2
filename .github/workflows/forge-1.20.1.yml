name: Forge 1.20.1 build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - port/forge-1.20.1-2.2.9
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Forge mod
        run: bash ./gradlew --no-daemon build

      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: photon-forge-1.20.1
          path: build/libs/*-all.jar
          if-no-files-found: error
          retention-days: 14

      - name: Smoke-test dedicated Forge server startup
        shell: bash
        run: |
          set +e
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          log_file="$RUNNER_TEMP/photon-server.log"
          timeout --signal=INT --kill-after=15s 180s bash ./gradlew --no-daemon runServer > "$log_file" 2>&1 &
          server_pid=$!
          for _ in $(seq 1 180); do
            if grep -Fq 'For help, type "help"' "$log_file"; then
              echo "Forge server reached the ready state."
              kill -INT "$server_pid" 2>/dev/null
              wait "$server_pid"
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              wait "$server_pid"
              result=$?
              cat "$log_file"
              exit "$result"
            fi
            sleep 1
          done
          cat "$log_file"
          kill -INT "$server_pid" 2>/dev/null
          wait "$server_pid"
          echo "Forge server did not reach the ready state within 180 seconds." >&2
          exit 1
