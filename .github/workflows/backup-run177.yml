name: Preserve tested Photon JAR

on:
  push:
    branches:
      - backup/photon-forge-run177
    paths:
      - .github/workflows/backup-run177.yml

permissions:
  actions: read
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Download the tested build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: photon-forge-1.20.1
          run-id: 40522056464
          github-token: ${{ github.token }}
          path: saved

      - name: Verify and preserve the JAR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          jar='saved/photon-forge-1.20.1-26.2.2.9-forge.1.20.1-all.jar'
          printf '%s  %s\n' '950348e8730980befd77209223fde0ed98d6f0c14a631f3ae369c8633e44fb84' "$jar" | sha256sum -c -
          gh release create backup-forge-1.20.1-run177 "$jar" --draft --target 2a0e0f9d8904e71a9e8267866e80777d7b88477d --title 'Backup: Photon Forge 1.20.1 run 177' --notes 'Backup of the exact JAR tested in test-1. SHA-256: 950348e8730980befd77209223fde0ed98d6f0c14a631f3ae369c8633e44fb84. This is an unfinished port snapshot.'
