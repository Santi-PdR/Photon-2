plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = mod_version
group = maven_group

configurations {
    libraries
    api.extendsFrom libraries

    photonRuntime
    jarJar

    localImplementation
    runtimeClasspath.extendsFrom localImplementation
    compileOnly.extendsFrom localImplementation
}

def requestedRunTasks = gradle.startParameter.taskNames.collect { it.tokenize(':').last() }
def serverRunRequested = requestedRunTasks.any { it in ['runServer', 'runGameTestServer'] }

// Client rendering mods must never enter a physical server. Both switches retain their compile API.
if (serverRunRequested || project.hasProperty('skipClientRenderMods')) {
    configurations.runtimeClasspath.exclude group: 'maven.modrinth', module: 'embeddium'
    configurations.runtimeClasspath.exclude group: 'maven.modrinth', module: 'oculus'
} else if (project.hasProperty('skipOculus')) {
    // Diagnostic client run switch: expose vanilla GLSL errors while keeping Embeddium active.
    configurations.runtimeClasspath.exclude group: 'maven.modrinth', module: 'oculus'
}

repositories {
    mavenCentral()
    mavenLocal()
    flatDir {
        dirs "$buildDir/prepared-runtime", 'libs'
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    } // Modrinth File
    maven {
        name = "Kotlin for Forge"
        url = "https://thedarkcolour.github.io/KotlinForForge/"
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven { url = "https://maven.parchmentmc.org" } // Parchment mappings
    maven { url = "https://maven.quiltmc.org/repository/release" } // Quilt Mappings
    // mavens for Forge-exclusives
    maven { // Create Forge and Registrate Forge
        url = "https://maven.tterrag.com/"
        content {
            includeGroup("com.tterrag.registrate")
            includeGroup("com.simibubi.create")
        }
    }
    maven { url = "https://jitpack.io/" } // Mixin Extras, Fabric ASM
    // LDLib2
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.firstdark.dev/snapshots"
    }
}

def prepareKotlinRuntime = tasks.register('prepareKotlinRuntime', Exec) {
    group = 'build setup'
    description = 'Packages KFF as kotlin.stdlib and removes LDLib2’s duplicate from Photon’s private copy.'
    def sourceArchive = rootProject.file("libs/kotlinforforge-${project.kotlinforforge_version}.jar")
    def outputArchive = rootProject.file("libs/kotlinruntime-${project.kotlinforforge_version}.jar")
    def ldlib2Source = rootProject.file('libs/ldlib2-forge-1.20.1-2.2.39.a+forge.1.20.1-all.jar')
    def ldlib2Output = rootProject.file('build/prepared-runtime/ldlib2-forge-1.20.1-2.2.39.a+forge.1.20.1-all.jar')
    inputs.file(sourceArchive)
    inputs.file(ldlib2Source)
    inputs.file(rootProject.file('gradle/prepare-kotlin-runtime.py'))
    outputs.file(outputArchive)
    outputs.file(ldlib2Output)
    commandLine 'python3', rootProject.file('gradle/prepare-kotlin-runtime.py'), sourceArchive, outputArchive, ldlib2Source, ldlib2Output
}

base {
    archivesName = "${project.name}-${minecraft_version}"
}

// Minecraft 1.20.1 and Forge 47 target Java 17.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

// Default run configurations.
// These can be tweaked, removed, or duplicated as needed.
runs {
    // applies to all the run configs below
    configureEach {
        // Recommended logging data for a userdev environment
        // The markers can be added/remove as needed separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        workingDirectory project.file('run')
        property 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        // You can set various levels here.
        // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
        property 'forge.logging.console.level', 'debug'
        property 'mixin.env.remapRefMap', 'true'
        property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
        arg '-mixin.config=photon.mixins.json'
//        systemProperty 'mixin.debug', 'true'

        mods {
            "${mod_id}" {
                source sourceSets.main
            }
        }
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        property 'forge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        property 'forge.enabledGameTestNamespaces', project.mod_id
        args '--nogui'
    }

    // This run config launches GameTestServer and runs all registered gametests, then exits.
    // By default, the server will crash when no gametests are provided.
    // The gametest system is also enabled by default for other run configs under the /test command.
    gameTestServer {
        property 'forge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
        // workingDirectory project.file('run-data')

        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        workingDirectory project.file('run-data')
        args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
    }
}
}

// LDLib2's in-client UI test harness: -PldTest wiring plus the verifyUiTest gate.
// Inert unless -PldTest is given. See LDLib2 docs/uitest.md.
def ldlibUiTestScript = rootProject.file('gradle/ldlib2-uitest.gradle')
if (ldlibUiTestScript.exists()) apply from: ldlibUiTestScript
def materialPersistenceTestScript = rootProject.file('gradle/material-persistence-test.gradle')
if (materialPersistenceTestScript.exists()) apply from: materialPersistenceTestScript

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }
// LDLib2's published runtime jar does not contain its optional in-client UI test harness.
// Keep the scenarios in source control, but do not package them into the production mod.
sourceSets.main.java { exclude 'com/lowdragmc/photon/uitest/**' }


dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // LDLib 1.0.52.a is the profile-facing API. Newer Photon editor systems use LDLib2 APIs,
    // so keep those runtime modules private to this mod instead of requiring users to install them.
    implementation fg.deobf("local:ldlib-forge-1.20.1:${ldlib_version}")
    implementation fg.deobf("local:ldlib2-forge-1.20.1:2.2.39.a+forge.1.20.1-all")
    implementation fg.deobf("local:kilagraph-forge-1.20.1-forge4710:20.1.0.15")
    implementation "local:kotlinruntime:${kotlinforforge_version}"
    def ldlib2Runtime = jarJar(fg.deobf("local:ldlib2-forge-1.20.1:2.2.39.a+forge.1.20.1-all"))
    jarJar.ranged(ldlib2Runtime, "[2.2.39.a,)")
    def kilaGraphRuntime = jarJar(fg.deobf("local:kilagraph-forge-1.20.1-forge4710:20.1.0.15"))
    jarJar.ranged(kilaGraphRuntime, "[20.1.0.15,)")
    def kotlinRuntime = jarJar("local:kotlinruntime:${kotlinforforge_version}")
    jarJar.ranged(kotlinRuntime, "[${kotlinforforge_version},)")

    // Optional shader-pack integration for Forge 1.20.1 (Oculus is the Iris port).
    localImplementation fg.deobf("maven.modrinth:embeddium:${embeddium_version}")
    localImplementation fg.deobf("maven.modrinth:oculus:${oculus_version}")

    compileOnly "org.projectlombok:lombok:${lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${lombok_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testCompileOnly "org.projectlombok:lombok:${lombok_version}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombok_version}"

    // Unit tests (JUnit 5). Only for MC-free logic such as the Timeline evaluation core.
    testImplementation(platform("org.junit:junit-bom:5.11.3"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

tasks.named('compileJava').configure {
    dependsOn prepareKotlinRuntime
}
tasks.named('jarJar').configure {
    dependsOn prepareKotlinRuntime
}

mixin {
    add sourceSets.main, 'photon.refmap.json'
    config 'photon.mixins.json'
}

test {
    useJUnitPlatform()
}

tasks.withType(ProcessResources).configureEach {
    // set up properties for filling into metadata
    var replaceProperties = [
            "mod_id": mod_id,
            "version": version,
            "loader_version_range": loader_version_range,
            "forge_version_range": forge_version_range,
            "minecraft_version": minecraft_version,
            "mod_license": mod_license,
            "mod_name": mod_name,
            "mod_description": mod_description,
            "mod_url": mod_url,
            "ldlib_version_range": ldlib_version_range,
            "ldlib2_version_range": ldlib2_version_range,
            "kilagraph_version_range": kilagraph_version_range,
        ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
        rename { 'LICENSE.txt' }
    }
    from(rootProject.file('libs/licenses')) {
        into 'META-INF/licenses'
    }
    manifest {
        attributes 'MixinConfigs': 'photon.mixins.json'
    }
    finalizedBy 'reobfJar'
}

tasks.named('jarJar').configure {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
        rename { 'LICENSE.txt' }
    }
    from(rootProject.file('libs/licenses')) {
        into 'META-INF/licenses'
    }
    finalizedBy 'reobfJarJar'
}
tasks.named('assemble').configure {
    dependsOn tasks.named('jarJar')
}

def verifyCommonSideArtifact = tasks.register('verifyCommonSideArtifact') {
    group = 'verification'
    description = 'Checks target metadata, Java 17 bytecode, mixin mappings, and dedicated-server class isolation in the reobfuscated Photon JAR.'
    dependsOn tasks.named('reobfJarJar')
    doLast {
        def artifact = tasks.named('jarJar').get().archiveFile.get().asFile
        if (!artifact.isFile()) {
            throw new GradleException("Reobfuscated Photon artifact is missing: ${artifact}")
        }

        def scanned = 0
        def photonClasses = 0
        def incompatibleBytecode = []
        def violations = []
        def zip = new java.util.zip.ZipFile(artifact)
        try {
            def requiredEntries = [
                    'META-INF/mods.toml',
                    'META-INF/accesstransformer.cfg',
                    'META-INF/LICENSE.txt',
                    'META-INF/licenses/Apache-2.0.txt',
                    'META-INF/licenses/GPL-3.0-only.txt',
                    'META-INF/licenses/LGPL-2.1-only.txt',
                    'META-INF/licenses/LGPL-3.0-only.txt',
                    'META-INF/licenses/KilaGraph-MIT.txt',
                    'META-INF/jarjar/metadata.json',
                    'META-INF/jarjar/ldlib2-forge-1.20.1-2.2.39.a+forge.1.20.1-all.jar',
                    'META-INF/jarjar/kilagraph-forge-1.20.1-forge4710-20.1.0.15.jar',
                    "META-INF/jarjar/kotlinruntime-${project.kotlinforforge_version}.jar",
                    'photon.mixins.json',
                    'photon.refmap.json',
                    'assets/photon/textures/icon.png'
            ]
            def missingEntries = requiredEntries.findAll { zip.getEntry(it) == null }
            if (!missingEntries.isEmpty()) {
                throw new GradleException("Photon artifact is missing required entries: ${missingEntries.join(', ')}")
            }
            def mixinConfig = new groovy.json.JsonSlurper().parseText(
                    new String(zip.getInputStream(zip.getEntry('photon.mixins.json')).withCloseable {
                        it.readAllBytes()
                    }, java.nio.charset.StandardCharsets.UTF_8))
            if (mixinConfig.refmap != 'photon.refmap.json') {
                throw new GradleException("Photon mixin config does not reference photon.refmap.json")
            }
            def refmap = new groovy.json.JsonSlurper().parseText(
                    new String(zip.getInputStream(zip.getEntry('photon.refmap.json')).withCloseable {
                        it.readAllBytes()
                    }, java.nio.charset.StandardCharsets.UTF_8))
            def requiredMixinMappings = [
                    'com/lowdragmc/photon/core/mixins/GameRendererMixin': [
                            'renderLevel(FJLcom/mojang/blaze3d/vertex/PoseStack;)V': 'Lnet/minecraft/client/renderer/GameRenderer;m_109089_(FJLcom/mojang/blaze3d/vertex/PoseStack;)V',
                            'render(FJZ)V': 'Lnet/minecraft/client/renderer/GameRenderer;m_109093_(FJZ)V',
                            'Lnet/minecraft/client/renderer/LevelRenderer;renderLevel(Lcom/mojang/blaze3d/vertex/PoseStack;FJZLnet/minecraft/client/Camera;Lnet/minecraft/client/renderer/GameRenderer;Lnet/minecraft/client/renderer/LightTexture;Lorg/joml/Matrix4f;)V': 'Lnet/minecraft/client/renderer/LevelRenderer;m_109599_(Lcom/mojang/blaze3d/vertex/PoseStack;FJZLnet/minecraft/client/Camera;Lnet/minecraft/client/renderer/GameRenderer;Lnet/minecraft/client/renderer/LightTexture;Lorg/joml/Matrix4f;)V'
                    ],
                    'com/lowdragmc/photon/core/mixins/ParticleEngineMixin': [
                            'tick': 'Lnet/minecraft/client/particle/ParticleEngine;m_107388_()V',
                            'setLevel': 'Lnet/minecraft/client/particle/ParticleEngine;m_107342_(Lnet/minecraft/client/multiplayer/ClientLevel;)V'
                    ],
                    'com/lowdragmc/photon/core/mixins/MinecraftMixin': [
                            'resizeDisplay': 'Lnet/minecraft/client/Minecraft;m_5741_()V'
                    ],
                    'com/lowdragmc/photon/core/mixins/accessor/BlendModeAccessor': [
                            'lastApplied': 'f_85499_:Lcom/mojang/blaze3d/shaders/BlendMode;'
                    ],
                    'com/lowdragmc/photon/core/mixins/accessor/ShaderInstanceAccessor': [
                            'samplerNames': 'f_173329_:Ljava/util/List;',
                            'blend': 'f_173302_:Lcom/mojang/blaze3d/shaders/BlendMode;'
                    ],
                    'com/lowdragmc/photon/core/mixins/accessor/ParticleEngineAccessor': [
                            'particles': 'f_107289_:Ljava/util/Map;',
                            'spriteSets': 'f_107295_:Ljava/util/Map;'
                    ]
            ]
            def missingMixinMappings = []
            requiredMixinMappings.each { mixinClass, mappings ->
                def actual = refmap.mappings?.get(mixinClass)
                mappings.each { source, target ->
                    if (!(actual?.get(source)?.contains(target))) {
                        missingMixinMappings << "${mixinClass}.${source} -> ${target}"
                    }
                }
            }
            if (!missingMixinMappings.isEmpty()) {
                throw new GradleException("Photon production refmap is missing required Minecraft mappings: ${missingMixinMappings}")
            }
            def metadata = new String(zip.getInputStream(zip.getEntry('META-INF/mods.toml')).withCloseable {
                it.readAllBytes()
            }, java.nio.charset.StandardCharsets.UTF_8)
            def requiredMetadata = [
                    'modId = "photon"',
                    "version = \"${project.version}\"",
                    'versionRange = "[1.20.1]"',
                    "versionRange = \"${project.forge_version_range}\"",
                    'modId = "ldlib"',
                    "versionRange = \"${project.ldlib_version_range}\""
            ]
            def missingMetadata = requiredMetadata.findAll { !metadata.contains(it) }
            if (!missingMetadata.isEmpty()) {
                throw new GradleException("Photon artifact metadata does not match the 1.20.1 Forge target: ${missingMetadata.join(', ')}")
            }

            def jarJarMetadata = new groovy.json.JsonSlurper().parseText(
                    new String(zip.getInputStream(zip.getEntry('META-INF/jarjar/metadata.json')).withCloseable {
                        it.readAllBytes()
                    }, java.nio.charset.StandardCharsets.UTF_8))
            def kilaGraphDependency = jarJarMetadata.jars.find { dependency ->
                dependency.identifier?.artifact == 'kilagraph-forge-1.20.1-forge4710'
            }
            if (kilaGraphDependency?.version?.artifactVersion != '20.1.0.15'
                    || kilaGraphDependency?.version?.range != '[20.1.0.15,)'
                    || !metadata.contains('versionRange = "[20.1.0.15,)"')) {
                throw new GradleException('Photon must select the KilaGraph 20.1.0.15 build adapted to Forge 47.4.10')
            }

            def kilaGraphPath = kilaGraphDependency.path
            def nestedKilaGraph = new java.util.zip.ZipInputStream(new java.io.ByteArrayInputStream(
                    zip.getInputStream(zip.getEntry(kilaGraphPath)).withCloseable { it.readAllBytes() }))
            def kilaGraphModsToml = null
            try {
                def nestedEntry
                while ((nestedEntry = nestedKilaGraph.nextEntry) != null) {
                    if (nestedEntry.name == 'META-INF/mods.toml') {
                        kilaGraphModsToml = new String(nestedKilaGraph.readAllBytes(), java.nio.charset.StandardCharsets.UTF_8)
                        break
                    }
                }
            } finally {
                nestedKilaGraph.close()
            }
            if (kilaGraphModsToml == null
                    || !kilaGraphModsToml.contains('version = "20.1.0.15"')
                    || !kilaGraphModsToml.contains('versionRange = "[47.4.10,48)"')) {
                throw new GradleException('The nested KilaGraph jar is not the Forge 47.4.10 build')
            }

            def kotlinDependency = jarJarMetadata.jars.find { dependency ->
                dependency.identifier?.artifact == 'kotlinruntime'
            }
            if (kotlinDependency?.version?.artifactVersion != project.kotlinforforge_version
                    || kotlinDependency?.version?.range != "[${project.kotlinforforge_version},)") {
                throw new GradleException("Photon must package the local Kotlin runtime ${project.kotlinforforge_version}")
            }
            def kotlinRuntimePath = kotlinDependency.path
            def nestedKotlinRuntime = new java.util.zip.ZipInputStream(new java.io.ByteArrayInputStream(
                    zip.getInputStream(zip.getEntry(kotlinRuntimePath)).withCloseable { it.readAllBytes() }))
            def kotlinRuntimeManifest = null
            def kotlinRuntimeHasStdlibClass = false
            def kotlinRuntimeHasCoroutines = false
            def kotlinRuntimeHasModuleDescriptor = false
            def nestedKffModules = null
            try {
                def nestedEntry
                while ((nestedEntry = nestedKotlinRuntime.nextEntry) != null) {
                    if (nestedEntry.name == 'META-INF/MANIFEST.MF') {
                        kotlinRuntimeManifest = new String(nestedKotlinRuntime.readAllBytes(), java.nio.charset.StandardCharsets.UTF_8)
                    } else if (nestedEntry.name.startsWith('kotlin/')
                            || nestedEntry.name.startsWith('META-INF/versions/9/kotlin/')
                            || nestedEntry.name.startsWith('_COROUTINE/')) {
                        kotlinRuntimeHasStdlibClass = true
                    } else if (nestedEntry.name == 'kotlinx/coroutines/CoroutineScope.class') {
                        kotlinRuntimeHasCoroutines = true
                    } else if (nestedEntry.name.endsWith('module-info.class')) {
                        kotlinRuntimeHasModuleDescriptor = true
                    } else if (nestedEntry.name == 'META-INF/jarjar/metadata.json') {
                        nestedKffModules = new groovy.json.JsonSlurper().parseText(
                                new String(nestedKotlinRuntime.readAllBytes(), java.nio.charset.StandardCharsets.UTF_8))
                    }
                }
            } finally {
                nestedKotlinRuntime.close()
            }
            if (kotlinRuntimeManifest == null
                    || !kotlinRuntimeManifest.contains('Automatic-Module-Name: kotlin.stdlib')
                    || !kotlinRuntimeManifest.contains('Photon-Kotlin-Stdlib-Version: 2.1.20')
                    || kotlinRuntimeHasModuleDescriptor
                    || !kotlinRuntimeHasStdlibClass
                    || !kotlinRuntimeHasCoroutines) {
                throw new GradleException('Photon must package KFF as the sole kotlin.stdlib provider')
            }
            def requiredKffArtifacts = ['kfflang', 'kfflib', 'kffmod']
            if (nestedKffModules == null || requiredKffArtifacts.any { required ->
                !nestedKffModules.jars.any { it.identifier?.artifact == required
                        && it.version?.artifactVersion == project.kotlinforforge_version }
            }) {
                throw new GradleException('Photon Kotlin runtime is missing the nested KFF language, library, or mod modules')
            }

            def nestedLdlib2 = new java.util.zip.ZipInputStream(new java.io.ByteArrayInputStream(
                    zip.getInputStream(zip.getEntry('META-INF/jarjar/ldlib2-forge-1.20.1-2.2.39.a+forge.1.20.1-all.jar'))
                            .withCloseable { it.readAllBytes() }))
            def ldlib2HasKotlinStdlib = false
            try {
                def nestedEntry
                while ((nestedEntry = nestedLdlib2.nextEntry) != null) {
                    if (nestedEntry.name.startsWith('META-INF/jarjar/kotlin-stdlib-')
                            && nestedEntry.name.endsWith('.jar')) {
                        ldlib2HasKotlinStdlib = true
                        break
                    }
                }
            } finally {
                nestedLdlib2.close()
            }
            if (ldlib2HasKotlinStdlib) {
                throw new GradleException('Photon LDLib2 copy must not bundle a second Kotlin stdlib provider')
            }

            def entries = zip.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                if (entry.directory || !entry.name.startsWith('com/lowdragmc/photon/') || !entry.name.endsWith('.class')) {
                    continue
                }
                photonClasses++
                def bytes = zip.getInputStream(entry).withCloseable { it.readAllBytes() }
                def majorVersion = ((bytes[6] & 0xff) << 8) | (bytes[7] & 0xff)
                if (majorVersion != 61) {
                    incompatibleBytecode << "${entry.name} uses classfile major version ${majorVersion}"
                }

                def relative = entry.name.substring('com/lowdragmc/photon/'.length())
                def path = relative.toLowerCase(java.util.Locale.ROOT)
                if (path.startsWith('client/') || path.startsWith('gui/') || path.startsWith('uitest/')
                        || path.startsWith('core/mixins/') || path.endsWith('$client.class')
                        || path == 'integration/photonldlibclientplugin.class') {
                    continue
                }

                scanned++
                def constantPool = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                [
                        'net/minecraft/client/': 'net/minecraft/client',
                        'net/minecraftforge/client/': 'net/minecraftforge/client',
                        'com/mojang/blaze3d/': 'com/mojang/blaze3d',
                        'com/lowdragmc/lowdraglib2/client/': 'com/lowdragmc/lowdraglib2/client',
                        'org/lwjgl/': 'org/lwjgl'
                ].each { reference, label ->
                    if (constantPool.contains(reference)) {
                        violations << "${entry.name} references ${label}"
                    }
                }
            }
        } finally {
            zip.close()
        }

        if (scanned == 0) {
            throw new GradleException("No common Photon classfiles were found in ${artifact}")
        }
        if (photonClasses == 0) {
            throw new GradleException("No Photon classfiles were found in ${artifact}")
        }
        if (!incompatibleBytecode.isEmpty()) {
            throw new GradleException("Photon classes must use Java 17 bytecode (major 61):\n - ${incompatibleBytecode.join('\n - ')}")
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Common-side client API links in ${artifact}:\n - ${violations.join('\n - ')}")
        }
        logger.lifecycle("Verified ${artifact.name}: Photon 26.2.2.3 targets Minecraft 1.20.1/Forge ${project.forge_version}, all ${photonClasses} Photon classes use Java 17 bytecode, and ${scanned} common classes have no direct client-only Minecraft, Forge, Blaze3D, LDLib2, or LWJGL links.")
    }
}

def verifyKffLanguageProvider = tasks.register('verifyKffLanguageProvider') {
    group = 'verification'
    description = 'Executes KotlinForForge’s scan visitor in an isolated Forge JPMS layer.'
    dependsOn tasks.named('reobfJarJar')
    inputs.file(rootProject.file('gradle/KotlinLanguageProviderProbe.java'))
    doLast {
        def artifact = tasks.named('jarJar').get().archiveFile.get().asFile
        def moduleDirectory = rootProject.file('build/kff-language-provider-probe')
        delete(moduleDirectory)
        moduleDirectory.mkdirs()

        def modules = []
        def outer = new java.util.zip.ZipFile(artifact)
        try {
            def runtimePath = "META-INF/jarjar/kotlinruntime-${project.kotlinforforge_version}.jar"
            def runtimeBytes = outer.getInputStream(outer.getEntry(runtimePath)).withCloseable { it.readAllBytes() }
            def runtimeCarrier = new File(moduleDirectory, "kotlinruntime-${project.kotlinforforge_version}.jar")
            runtimeCarrier.bytes = runtimeBytes
            modules << runtimeCarrier
            def runtimeZip = new java.util.zip.ZipInputStream(new java.io.ByteArrayInputStream(runtimeBytes))
            try {
                def runtimeEntry
                while ((runtimeEntry = runtimeZip.nextEntry) != null) {
                    if (runtimeEntry.name.startsWith('META-INF/jarjar/kff')
                            && runtimeEntry.name.endsWith('.jar')) {
                        def destination = new File(moduleDirectory, runtimeEntry.name.substring('META-INF/jarjar/'.length()))
                        destination.bytes = runtimeZip.readAllBytes()
                        modules << destination
                    }
                }
            } finally {
                runtimeZip.close()
            }

            def ldlib2Entry = outer.getEntry('META-INF/jarjar/ldlib2-forge-1.20.1-2.2.39.a+forge.1.20.1-all.jar')
            def ldlib2File = new File(moduleDirectory, 'ldlib2-forge-1.20.1-2.2.39.a+forge.1.20.1-all.jar')
            ldlib2File.bytes = outer.getInputStream(ldlib2Entry).withCloseable { it.readAllBytes() }
            modules << ldlib2File
        } finally {
            outer.close()
        }

        def requiredClasses = [
                'net/minecraftforge/forgespi/language/ModFileScanData.class',
                'org/objectweb/asm/Type.class',
                'net/minecraftforge/fml/Logging.class',
                'org/apache/logging/log4j/Logger.class'
        ]
        def compileJars = configurations.compileClasspath.files.findAll { it.isFile() && it.name.endsWith('.jar') }
        requiredClasses.each { classEntry ->
            def owner = compileJars.find { candidate ->
                def candidateZip = new java.util.zip.ZipFile(candidate)
                try {
                    candidateZip.getEntry(classEntry) != null
                } finally {
                    candidateZip.close()
                }
            }
            if (owner == null) {
                throw new GradleException("Cannot locate ${classEntry} for the KFF language-provider probe")
            }
            if (!modules.contains(owner)) modules << owner
        }

        def javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(17)
        }.get()
        exec {
            executable javaLauncher.executablePath.asFile
            args(([rootProject.file('gradle/KotlinLanguageProviderProbe.java')] + modules)
                    .collect { it.absolutePath })
        }
    }
}

tasks.named('check') {
    dependsOn verifyCommonSideArtifact, verifyKffLanguageProvider
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = archivesBaseName
            from components.java
        }
    }
    repositories {
        maven {
            url "https://maven.firstdark.dev/snapshots"
            credentials {
                username System.getenv("MAVEN_USER")
                password System.getenv("MAVEN_PASS")
            }
        }
    }
}
